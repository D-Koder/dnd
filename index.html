async function attemptBothEndpoints(body, signal){
  // /api/dm is the Vercel serverless proxy (keeps your API key server-side).
  // If it's not present — e.g. previewing this file inside Claude.ai's artifact panel —
  // fall back to calling Anthropic directly, which that environment authenticates for you.
  // Every attempt is logged with real status/body detail so failures are debuggable,
  // instead of collapsing into a generic "Load failed" message.
  const attempts = [];
  try{
    const res = await fetch("/api/dm", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(body),
      signal
    });
    if(res.status === 404){
      attempts.push({ endpoint:'/api/dm', status:404, detail:'no proxy route present (expected when previewing outside Vercel)' });
      throw new Error('no proxy route');
    }
    if(!res.ok){
      let bodyText = ''; try{ bodyText = (await res.text()).slice(0,400); }catch(e){}
      attempts.push({ endpoint:'/api/dm', status:res.status, detail:bodyText || res.statusText });
      const err = new Error(`/api/dm returned HTTP ${res.status}`);
      err.debugAttempts = attempts;
      throw err;
    }
    attempts.push({ endpoint:'/api/dm', status:res.status, detail:'ok' });
    return await res.json();
  }catch(e1){
    if(e1.name === 'AbortError') throw e1;
    if(!attempts.length) attempts.push({ endpoint:'/api/dm', status:null, detail: e1.message || 'network error (fetch threw before a response)' });
    try{
      const res2 = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(body),
        signal
      });
      if(!res2.ok){
        let bodyText2 = ''; try{ bodyText2 = (await res2.text()).slice(0,400); }catch(e){}
        attempts.push({ endpoint:'api.anthropic.com (direct)', status:res2.status, detail:bodyText2 || res2.statusText });
        const err = new Error(`Direct Anthropic call returned HTTP ${res2.status}`);
        err.debugAttempts = attempts;
        throw err;
      }
      attempts.push({ endpoint:'api.anthropic.com (direct)', status:res2.status, detail:'ok' });
      return await res2.json();
    }catch(e2){
      if(e2.name === 'AbortError') throw e2;
      if(!attempts.some(a=>a.endpoint.includes('anthropic.com'))){
        attempts.push({ endpoint:'api.anthropic.com (direct)', status:null, detail: e2.message || 'network error (fetch threw before a response)' });
      }
      const finalErr = new Error('Both DM endpoints failed — see debug log for details.');
      finalErr.debugAttempts = attempts;
      throw finalErr;
    }
  }
}
// ---- Incremental narration extraction while the tool-use JSON streams in ----
// The model streams its structured output as raw JSON text (input_json_delta chunks).
// We can't parse the whole thing until it's complete, but "narration" is the first
// schema field, so we can pull its string value out character-by-character as it
// arrives and show it live, well before the rest of the response finishes.
function createNarrationExtractor(onUpdate){
  let json = '';
  let phase = 'seek-key'; // seek-key -> seek-colon -> seek-quote -> in-string -> done
  let scanPos = 0;
  let value = '';
  let escaping = false;
  return function feed(chunk){
    json += chunk;
    if(phase === 'done') return;
    if(phase === 'seek-key'){
      const idx = json.indexOf('"narration"');
      if(idx === -1) return;
      scanPos = idx + '"narration"'.length;
      phase = 'seek-colon';
    }
    while(scanPos < json.length && phase !== 'done'){
      const ch = json[scanPos];
      if(phase === 'seek-colon'){
        if(ch === ':'){ phase = 'seek-quote'; }
        scanPos++;
        continue;
      }
      if(phase === 'seek-quote'){
        if(ch === ' ' || ch === '\n' || ch === '\t'){ scanPos++; continue; }
        if(ch === '"'){ phase = 'in-string'; scanPos++; continue; }
        phase = 'done'; return; // unexpected — bail out of live extraction quietly
      }
      if(phase === 'in-string'){
        if(escaping){
          if(ch === 'n') value += '\n';
          else if(ch === 't') value += '\t';
          else if(ch === '"') value += '"';
          else if(ch === '\\') value += '\\';
          else value += ch;
          escaping = false; scanPos++; continue;
        }
        if(ch === '\\'){ escaping = true; scanPos++; continue; }
        if(ch === '"'){ phase = 'done'; scanPos++; onUpdate(value); return; }
        value += ch; scanPos++; continue;
      }
    }
    if(phase === 'in-string') onUpdate(value);
  };
}
async function callDMApiStreaming(body, onNarrationDelta){
  const res = await fetch("/api/dm", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(Object.assign({}, body, { stream:true }))
  });
  if(res.status === 404 || !res.ok || !res.body) throw new Error('streaming proxy unavailable');

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  const extractor = createNarrationExtractor(onNarrationDelta);
  let buffer = '';
  let toolInputJson = '';
  let usage = {};

  while(true){
    const { done, value } = await reader.read();
    if(done) break;
    buffer += decoder.decode(value, { stream:true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for(const line of lines){
      const trimmed = line.trim();
      if(!trimmed.startsWith('data:')) continue;
      const dataStr = trimmed.slice(5).trim();
      if(!dataStr || dataStr === '[DONE]') continue;
      let evt;
      try{ evt = JSON.parse(dataStr); }catch(e){ continue; }
      if(evt.type === 'content_block_delta' && evt.delta && evt.delta.type === 'input_json_delta'){
        toolInputJson += evt.delta.partial_json;
        extractor(evt.delta.partial_json);
      } else if(evt.type === 'message_start' && evt.message && evt.message.usage){
        usage = Object.assign({}, usage, evt.message.usage);
      } else if(evt.type === 'message_delta' && evt.usage){
        usage = Object.assign({}, usage, evt.usage);
      } else if(evt.type === 'error'){
        throw new Error(evt.error && evt.error.message ? evt.error.message : 'stream error event');
      }
    }
  }
  if(!toolInputJson) throw new Error('no tool input received via stream');
  return { input: JSON.parse(toolInputJson), usage };
}
async function callDMApi(body, signal){
  try{
    return await attemptBothEndpoints(body, signal);
  }catch(err){
    if(err.name === 'AbortError') throw err; // intentional cancellation, not a connection drop — don't retry
    // Only auto-retry when BOTH attempts got no HTTP response at all (status: null on both) —
    // that's the signature of a dropped connection, worth one quick retry rather than an
    // HTTP error (401/429/etc), which won't fix itself by retrying.
    const bothNoResponse = (err.debugAttempts||[]).length >= 2 && err.debugAttempts.every(a => a.status === null);
    if(!bothNoResponse) throw err;
    await new Promise(r => setTimeout(r, 1200));
    try{
      return await attemptBothEndpoints(body, signal);
    }catch(err2){
      if(err2.name === 'AbortError') throw err2;
      err2.debugAttempts = [...(err.debugAttempts||[]), { endpoint:'(retry)', status:null, detail:'retried once after connection drop, still failed' }, ...(err2.debugAttempts||[])];
      throw err2;
    }
  }
}
async function sendAction(actionText, meta){
  meta = meta || {};
  if(!meta.skipPlayerBubble){
    state.chat.push({ type: meta.isOOC ? 'player-ooc' : 'player', text: actionText });
  }
  state.lastOptions = [];
  state.loading = true;
  render();

  const payload = {
    player_action: actionText,
    current_state: buildStateSnapshot(),
    resolution: meta.resolution || null,
    is_ooc: !!meta.isOOC,
    is_resume: !!meta.isResume,
    override_invalid: !!meta.overrideInvalid
  };
  const requestBody = {
    model: state.settings.fastMode ? "claude-haiku-4-5-20251001" : "claude-sonnet-4-6",
    max_tokens:800,
    system: [
      { type:"text", text: buildStaticInstructions(), cache_control:{ type:"ephemeral" } },
      { type:"text", text: buildDynamicContext() }
    ],
    tools:[DM_TOOL_SCHEMA],
    tool_choice:{ type:"tool", name:"dm_response" },
    messages:[...chatToApiHistory(), { role:'user', content:[{type:'text', text: JSON.stringify(payload)}] }]
  };
  // Groq gets the identical instructions + history, just reformatted for its wire format —
  // same source of truth as Claude, so tone shouldn't drift depending on who wins the race.
  const groqSystemText = buildStaticInstructions() + '\n\n' + buildDynamicContext();
  const groqMessages = toOpenAIMessages([...chatToApiHistory(), { role:'user', content:[{type:'text', text: JSON.stringify(payload)}] }]);

  try{
    const startedAt = performance.now();
    // Racing two providers can't be fairly combined with live streaming (there's no way to
    // know which one will actually finish first until it does) — this trades the live-typing
    // effect for genuinely picking whichever provider is fastest end-to-end this turn.
    const result = await raceDMProviders(requestBody, groqSystemText, groqMessages);
    const elapsedMs = Math.round(performance.now() - startedAt);
    const usage = result.usage || {};
    logDebugEntry({
      context: 'DM call timing',
      action: actionText,
      message: `${elapsedMs}ms (won: ${result.provider}${elapsedMs < DM_RACE_GRACE_MS ? ', groq skipped' : ', groq engaged'}) · in:${usage.input_tokens||usage.prompt_tokens||'?'} out:${usage.output_tokens||usage.completion_tokens||'?'} cache_read:${usage.cache_read_input_tokens||0}`,
      attempts: null
    });
    await applyDMResponse(result.input, meta, actionText, null, result.provider);
  }catch(err){
    logDebugEntry({
      context: 'DM API call',
      action: actionText,
      message: err.message,
      attempts: err.debugAttempts || null
    });
    state.chat.push({ type:'dm-error', text:`⚠️ DM connection failed — check Status → Debug Log for details.`, originalAction: actionText, originalMeta: meta });
  }
  state.loading = false;
  render();
}
async function applyDMResponse(d, meta, originalActionText, existingMsgRef, provider){
  meta = meta || {};

  // Invalid-action check: the DM decided the described action isn't actually possible
  // (no such power, item doesn't exist/can't be removed, etc). Skip this entirely if the
  // player already chose to override — that retry is allowed to go through normally.
  if(!meta.isOOC && d.action_validity && d.action_validity.valid === false && !meta.overrideInvalid){
    if(existingMsgRef){
      const idx = state.chat.indexOf(existingMsgRef);
      if(idx>=0) state.chat.splice(idx,1);
    }
    state.chat.push({ type:'invalid-action', reason: d.action_validity.reason || "That doesn't seem possible right now.", originalAction: originalActionText });
    return;
  }

  if(existingMsgRef){
    existingMsgRef.text = d.narration;
    existingMsgRef.companions = meta.isOOC ? [] : (d.companions||[]);
    existingMsgRef.isOOC = !!meta.isOOC;
    existingMsgRef.streaming = false;
    existingMsgRef.provider = provider;
  } else {
    state.chat.push({ type:'dm', text:d.narration, companions: meta.isOOC ? [] : (d.companions||[]), isOOC: !!meta.isOOC, provider });
  }
  state.lastOptions = d.response_options || [];

  if(meta.isOOC){
    // OOC questions get answered but never touch character/quest/combat/world/party state,
    // and don't count as a save-worthy moment — nothing about the scene actually happened.
    return;
  }

  if(d.character_status && d.character_status.hp_delta) applyHpDelta(d.character_status.hp_delta);
  if(d.character_status && d.character_status.coins_delta) state.character.coins = Math.max(0, state.character.coins + d.character_status.coins_delta);
  if(d.character_status && d.character_status.magic_reserve != null) state.character.magicReserve = Math.max(0, Math.min(state.character.magicReserveMax, d.character_status.magic_reserve));
  if(d.quest && d.quest.current) state.character.quest = d.quest.current;
  if(d.combat){
    if(d.combat.active){
      state.combat = { active:true, creatureName:d.combat.enemy_name||'Unknown Foe', creatureHp:d.combat.enemy_hp??10, creatureMaxHp:d.combat.enemy_max_hp??10 };
    } else if(state.combat.active){
      state.combat.active = false;
    }
  }
  (d.save_worthy||[]).forEach(s=>state.sessionMeta.recentEvents.push(s));
  (d.quest && d.quest.new_threads || []).forEach(t=>state.sessionMeta.openThreads.push(t));
  if(d.session_summary){
    if(d.session_summary.where_we_are) state.sessionMeta.whereWeAre = d.session_summary.where_we_are;
  }

  let worldBibleChanged = false;
  if(d.world_bible_updates){
    const wb = state.worldBible;
    (d.world_bible_updates.new_locations||[]).forEach(l=>{ if(!wb.locations.includes(l)){ wb.locations.push(l); worldBibleChanged = true; } });
    (d.world_bible_updates.new_settlements||[]).forEach(s=>{
      if(!wb.settlements.some(existing=>existing.name===s.name)){ wb.settlements.push(s); worldBibleChanged = true; }
    });
    (d.world_bible_updates.new_factions||[]).forEach(f=>{ if(!wb.factions.includes(f)){ wb.factions.push(f); worldBibleChanged = true; } });
    (d.world_bible_updates.new_npcs||[]).forEach(n=>{ if(!wb.npcs.includes(n)){ wb.npcs.push(n); worldBibleChanged = true; } });
    (d.world_bible_updates.new_map_notes||[]).forEach(m=>{ if(!wb.map.includes(m)){ wb.map.push(m); worldBibleChanged = true; } });
    (d.world_bible_updates.new_artifacts||[]).forEach(a=>{ if(!wb.artifacts.includes(a)){ wb.artifacts.push(a); worldBibleChanged = true; } });
    if(d.world_bible_updates.currency && d.world_bible_updates.currency !== wb.currency){
      wb.currency = d.world_bible_updates.currency;
      worldBibleChanged = true;
    }
  }

  let partyChanged = false;
  if(d.party_updates){
    if(d.party_updates.bex_note && !state.party.bex.includes(d.party_updates.bex_note)){
      state.party.bex += `\n- ${d.party_updates.bex_note}`;
      partyChanged = true;
    }
    if(d.party_updates.thrum_note && !state.party.thrum.includes(d.party_updates.thrum_note)){
      state.party.thrum += `\n- ${d.party_updates.thrum_note}`;
      partyChanged = true;
    }
    if(d.party_updates.bex_status) state.party.bexStatus = d.party_updates.bex_status;
    if(d.party_updates.thrum_status) state.party.thrumStatus = d.party_updates.thrum_status;
  }

  let inventoryChanged = false;
  let newlyGained = [];
  if(d.inventory_updates){
    const c = state.character;
    if(!c.itemInfo) c.itemInfo = {};
    (d.inventory_updates.equip||[]).forEach(name=>{
      const idx = c.inventory.indexOf(name);
      if(idx>=0){ c.inventory.splice(idx,1); if(!c.equipped.includes(name)) c.equipped.push(name); inventoryChanged = true; }
    });
    (d.inventory_updates.unequip||[]).forEach(name=>{
      const idx = c.equipped.indexOf(name);
      if(idx>=0){ c.equipped.splice(idx,1); if(!c.inventory.includes(name)) c.inventory.push(name); inventoryChanged = true; }
    });
    (d.inventory_updates.drop||[]).forEach(name=>{
      const ii = c.inventory.indexOf(name); if(ii>=0){ c.inventory.splice(ii,1); inventoryChanged = true; }
      const ei = c.equipped.indexOf(name); if(ei>=0){ c.equipped.splice(ei,1); inventoryChanged = true; }
    });
    (d.inventory_updates.add||[]).forEach(entry=>{
      const name = entry.name, desc = entry.desc || '';
      if(!c.inventory.includes(name) && !c.equipped.includes(name)){
        c.inventory.push(name);
        c.itemInfo[name] = desc;
        newlyGained.push({ name, desc });
        inventoryChanged = true;
      }
    });
  }

  if(d.item_found){
    if(!state.character.itemInfo) state.character.itemInfo = {};
    state.character.itemInfo[d.item_found.name] = d.item_found.desc || '';
    state.pendingItemClaim = { kind:'item', item:d.item_found };
  } else if(newlyGained.length){
    state.pendingItemClaim = { kind:'items-gained', items:newlyGained };
  } else if(d.requires_roll){
    state.modal = { kind:'dice', requirement:d.requires_roll, chosenDie:d.requires_roll.die, result:null };
  }

  await persistSaveFiles();
  if(worldBibleChanged || partyChanged || inventoryChanged || (d.save_worthy||[]).length){
    const parts = [];
    if(worldBibleChanged) parts.push('world bible');
    if(partyChanged) parts.push('party');
    if(inventoryChanged) parts.push('inventory');
    if((d.save_worthy||[]).length) parts.push('session log');
    state.chat.push({ type:'note', text:`💾 Auto-saved — ${parts.join(', ')} updated.` });
  }
}

function downloadMarkdown(filename, content){
  const blob = new Blob([content], {type:'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
const FILE_NAMES = { character_sheet:'character_sheet.md', world_bible:'world_bible.md', party:'party.md', session_log:'session_log.md' };

// ---- Import: reverse of buildFileContent(), for loading real files back in ----
function extractSection(text, header){
  // Global + take the LAST match: real session logs can have multiple concatenated
  // entries (session continued → session concluded) appended over time. Always want
  // the most recent block, which is further down the file, not the first one.
  const re = new RegExp(`##\\s*${header}.*\\n([\\s\\S]*?)(?=\\n##\\s|$)`, 'gi');
  const matches = [...text.matchAll(re)];
  return matches.length ? matches[matches.length - 1][1].trim() : '';
}
function extractListItems(sectionText){
  if(!sectionText) return [];
  return sectionText.split('\n')
    .map(l=>l.replace(/^-\s*/,'').trim())
    .filter(l=>l && !/^\(none yet\)$/i.test(l));
}
function extractField(text, label){
  const re = new RegExp(`\\*\\*${label}:?\\*\\*\\s*(.*)`, 'gi');
  const matches = [...text.matchAll(re)];
  return matches.length ? matches[matches.length - 1][1].trim() : null;
}
function parseCharacterSheetMd(text){
  const name = extractField(text, 'Name');
  let species = extractField(text, 'Species/type') || extractField(text, 'Species');
  let klass = extractField(text, 'Class');
  // Your original character sheet writes this as one combined descriptive line
  // ("Coralkin — water/earth-fueled Tech Mage Schemer") rather than separate
  // Species/Class fields. Split on the em-dash so klass doesn't end up duplicated.
  if(species && species.includes('—')){
    const parts = species.split('—');
    const spOnly = parts[0].trim();
    const rest = parts.slice(1).join('—').trim();
    species = spOnly;
    if(!klass && rest) klass = rest;
  }
  const hp = extractField(text, 'HP') || extractField(text, 'HP / condition') || extractField(text, 'HP/condition');
  const grounding = extractField(text, 'Magic Grounding');
  const coinsLine = extractField(text, 'Coins');
  const reserveLine = extractField(text, 'Magic Reserve');
  const quest = extractField(text, 'Quest');
  const equippedLine = extractField(text, 'Equipped');
  const invLine = extractField(text, 'Inventory');
  const groundingMap = { 'Near Water':'water', 'On Stone':'stone', 'Wet Earth':'wet', 'Ungrounded':'none' };
  const out = {};
  if(name) out.name = name;
  if(species) out.species = species;
  if(klass) out.klass = klass;
  if(hp){
    const numMatch = hp.match(/(\d+)\s*\/\s*(\d+)/);
    if(numMatch){
      out.hpCurrent = parseInt(numMatch[1],10);
      out.hpMax = parseInt(numMatch[2],10);
      out.hp = hpLabel(out.hpCurrent, out.hpMax);
    } else if(['Healthy','Bruised','Hurt','Critical','Down'].includes(hp.trim())){
      // Old word-only format (no numbers) — keep the label as-is, don't touch the numeric pool.
      out.hp = hp.trim();
    }
  }
  if(grounding && groundingMap[grounding]) out.magicCharge = groundingMap[grounding];
  if(coinsLine){ const n = parseInt(coinsLine, 10); if(!isNaN(n)) out.coins = n; }
  if(reserveLine){ const m = reserveLine.match(/(\d+)\s*\/\s*(\d+)/); if(m){ out.magicReserve = parseInt(m[1],10); out.magicReserveMax = parseInt(m[2],10); } }
  if(quest) out.quest = quest;
  if(equippedLine && !/^\(nothing\)$/i.test(equippedLine)) out.equipped = equippedLine.split(',').map(s=>s.trim()).filter(Boolean);
  if(invLine) out.inventory = invLine.split(',').map(s=>s.trim()).filter(Boolean);
  return out;
}
function parseWorldBibleMd(text){
  const currency = extractSection(text, 'Currency');
  const settlementsRaw = extractListItems(extractSection(text, 'Settlements'));
  const settlements = settlementsRaw.map(line=>{
    const m = line.match(/^\*\*(.+?)\*\*\s*\((.+?)\)\s*—\s*(.*)$/);
    return m ? { name:m[1].trim(), type:m[2].trim(), notes:m[3].trim() } : { name:line, type:'other', notes:'' };
  }).filter(s=>s.name);
  const out = {
    locations: extractListItems(extractSection(text, 'Known Locations')),
    factions: extractListItems(extractSection(text, 'Factions')),
    npcs: extractListItems(extractSection(text, 'Key NPCs')),
    map: extractListItems(extractSection(text, 'Map Notes')),
    artifacts: extractListItems(extractSection(text, 'Notable Artifacts')),
  };
  if(settlements.length) out.settlements = settlements;
  if(currency && !/^\(not established/i.test(currency)) out.currency = currency;
  return out;
}
function parsePartyMd(text){
  const bex = extractSection(text, 'Bex');
  const thrum = extractSection(text, 'Thrum');
  const out = {};
  if(bex) out.bex = bex;
  if(thrum) out.thrum = thrum;
  return out;
}
function parseSessionLogMd(text){
  const sessionMatches = [...text.matchAll(/\*\*Session:?\*\*\s*(\d+)/gi)];
  const sessionMatch = sessionMatches.length ? sessionMatches[sessionMatches.length-1] : null;
  const partyStatus = extractSection(text, 'Party Status');
  const bexStatus = partyStatus.match(/\*\*Bex:?\*\*\s*(.*)/i);
  const thrumStatus = partyStatus.match(/\*\*Thrum:?\*\*\s*(.*)/i);
  const out = {
    whereWeAre: extractSection(text, 'Where We Are Right Now'),
    currentHook: extractSection(text, 'Current Quest\\s*/\\s*Hook') || extractSection(text, 'Current Quest'),
    // "Recent Events" is the real template's name; "Save-Worthy Moments" is this app's older export name — try both
    recentEvents: extractListItems(extractSection(text, 'Recent Events')).length
      ? extractListItems(extractSection(text, 'Recent Events'))
      : extractListItems(extractSection(text, 'Save-Worthy Moments')),
    openThreads: extractListItems(extractSection(text, 'Open Threads')),
  };
  if(sessionMatch) out.sessionNumber = parseInt(sessionMatch[1], 10);
  if(bexStatus) out.partyBexStatus = bexStatus[1].trim();
  if(thrumStatus) out.partyThrumStatus = thrumStatus[1].trim();
  return out;
}
function detectFileKind(filename){
  const norm = filename.toLowerCase().replace(/\.md$/,'').replace(/[\s_-]+/g,'');
  if(norm.includes('charactersheet')) return 'character_sheet';
  if(norm.includes('worldbible')) return 'world_bible';
  if(norm === 'party' || norm.includes('party')) return 'party';
  if(norm.includes('sessionlog')) return 'session_log';
  return null;
}
async function handleImportFiles(event){
  const files = Array.from(event.target.files || []);
  if(!files.length) return;
  const loaded = [];
  for(const file of files){
    const kind = detectFileKind(file.name);
    if(!kind) continue;
    const text = await file.text();
    if(kind === 'character_sheet') Object.assign(state.character, parseCharacterSheetMd(text));
    else if(kind === 'world_bible') Object.assign(state.worldBible, parseWorldBibleMd(text));
    else if(kind === 'party') Object.assign(state.party, parsePartyMd(text));
    else if(kind === 'session_log'){
      const parsed = parseSessionLogMd(text);
      if(parsed.partyBexStatus) state.party.bexStatus = parsed.partyBexStatus;
      if(parsed.partyThrumStatus) state.party.thrumStatus = parsed.partyThrumStatus;
      delete parsed.partyBexStatus; delete parsed.partyThrumStatus;
      Object.assign(state.sessionMeta, parsed);
    }
    loaded.push(FILE_NAMES[kind]);
  }
  event.target.value = '';
  if(loaded.length){
    await persistSaveFiles();
    state.chat.push({ type:'note', text:`💾 Loaded from disk: ${loaded.join(', ')}. This is now the active save.` });
  }
  render();
}

    }).join('\n\n');
    const today = new Date().toISOString().slice(0,10);
    return `# Session Log (SAVE STATE — source of truth for "where we are")

**Session:** ${state.sessionMeta.sessionNumber}
**Last updated:** ${today}

## Where We Are Right Now
${state.sessionMeta.whereWeAre || '(session just starting — nothing to recap yet)'}

## Current Quest / Hook
${state.sessionMeta.currentHook || c.quest}

## Recent Events (last few things that happened)
${state.sessionMeta.recentEvents.map(s=>'- '+s).join('\n') || '- (none yet)'}

## Open Threads
${state.sessionMeta.openThreads.map(s=>'- '+s).join('\n') || '- (none yet)'}

## Party Status
- **${c.name}:** ${c.hp} *(full inventory/coins/magic reserve in character_sheet.md)*
- **Bex:** ${state.party.bexStatus}
- **Thrum:** ${state.party.thrumStatus}
${state.worldBible.npcs.map(n=>'- **NPC:** '+n).join('\n')}

---
## Full Transcript (appendix)
${transcript}
`;
  }
  return '';
}

// ============================================================
// BACKGROUND — self-contained SVG star-chart + glyph watermark
// (no external fetch — guaranteed to render, no load-failure risk)
// ============================================================
function buildBackgroundSVG(){
  const w = 900, h = 1600;
  let rings = '';
  for(let i=0;i<5;i++){
    const cx = 150 + Math.random()*600, cy = 200 + Math.random()*1200, r = 60 + Math.random()*160;
    rings += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#C9704A" stroke-width="1" opacity="0.12"/>`;
  }
  let stars = '';
  for(let i=0;i<60;i++){
    const x = Math.random()*w, y = Math.random()*h, r = Math.random()*1.4 + 0.3;
    stars += `<circle cx="${x}" cy="${y}" r="${r}" fill="#E8DCC4" opacity="${(0.15+Math.random()*0.35).toFixed(2)}"/>`;
  }
  let lines = '';
  for(let i=0;i<8;i++){
    const y = (h/8)*i + 40;
    lines += `<line x1="0" y1="${y}" x2="${w}" y2="${y+30}" stroke="#4FB3A9" stroke-width="0.5" opacity="0.06"/>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice">
    <rect width="${w}" height="${h}" fill="#0C1A19"/>
    ${lines}
    ${rings}
    ${stars}
    <g transform="translate(450 800) scale(5.2)" opacity="0.05">
      <circle cx="-15" cy="-5" r="22" fill="none" stroke="#C9704A" stroke-width="2"/>
      <circle cx="15" cy="-5" r="22" fill="none" stroke="#C9704A" stroke-width="2"/>
      <circle cx="0" cy="18" r="22" fill="none" stroke="#C9704A" stroke-width="2"/>
      <path d="M-40 40 L-15 15 L-5 33 L10 10 L40 40" fill="none" stroke="#C9704A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </svg>`;
}
function applySvgFallbackBackground(){
  const svg = buildBackgroundSVG();
  const uri = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  const bg = document.getElementById('map-bg');
  bg.style.backgroundImage = `url("${uri}")`;
  bg.style.filter = 'none'; // SVG is already toned for the theme, no extra sepia needed
  requestAnimationFrame(()=>bg.classList.add('loaded'));
}

const MAP_QUERIES = ['antique nautical chart parchment','old world map engraving','antique map torn edges','historical sea chart parchment'];
async function loadMapBackground(){
  try{
    const query = MAP_QUERIES[Math.floor(Math.random()*MAP_QUERIES.length)];
    const url = 'https://commons.wikimedia.org/w/api.php?action=query&generator=search'
      + '&gsrsearch=' + encodeURIComponent(query) + '&gsrnamespace=6&gsrlimit=12'
      + '&prop=imageinfo&iiprop=url%7Cmime&iiurlwidth=1600&format=json&origin=*';
    // Note: deliberately not using AbortController/signal here — Claude.ai's artifact
    // preview proxies fetch() through an internal message channel that can't structured-clone
    // an AbortSignal, which throws "The object can not be cloned." Timeout via Promise.race
    // instead, which works in both the preview sandbox and real deployment.
    const res = await Promise.race([
      fetch(url),
      new Promise((_, reject) => setTimeout(()=>reject(new Error('map fetch timed out')), 5000))
    ]);
    const data = await res.json();
    const pages = data.query && data.query.pages ? Object.values(data.query.pages) : [];
    const candidates = pages.map(p=>p.imageinfo && p.imageinfo[0]).filter(i=>i && i.mime && i.mime.indexOf('image/')===0 && i.mime.indexOf('svg')===-1);
    if(!candidates.length) throw new Error('no usable results');
    const pick = candidates[Math.floor(Math.random()*candidates.length)];
    const imgUrl = pick.thumburl || pick.url;
    await new Promise((resolve, reject) => {
      const preload = new Image();
      preload.onload = resolve;
      preload.onerror = reject;
      preload.src = imgUrl;
    });
    const bg = document.getElementById('map-bg');
    bg.style.backgroundImage = `url("${imgUrl}")`;
    requestAnimationFrame(()=>bg.classList.add('loaded'));
  }catch(err){
    console.warn('Live map fetch unavailable, using glyph watermark fallback:', err.message);
    applySvgFallbackBackground();
  }
}
loadMapBackground();

render();
bootSaveFiles();
