// BACKGROUND — self-contained SVG star-chart + glyph watermark
// (no external fetch — guaranteed to render, no load-failure risk)
// ============================================================
function buildBackgroundSVG(){
  const w = 900, h = 1600;
  let rings = '';
  for(let i=0;i<5;i++){
    const cx = 150 + Math.random()*600, cy = 200 + Math.random()*1200, r = 60 + Math.random()*160;
    rings += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#C9704A" stroke-width="1" opacity="0.12"/>`;
  }
  let stars = '';
  for(let i=0;i<60;i++){
    const x = Math.random()*w, y = Math.random()*h, r = Math.random()*1.4 + 0.3;
    stars += `<circle cx="${x}" cy="${y}" r="${r}" fill="#E8DCC4" opacity="${(0.15+Math.random()*0.35).toFixed(2)}"/>`;
  }
  let lines = '';
  for(let i=0;i<8;i++){
    const y = (h/8)*i + 40;
    lines += `<line x1="0" y1="${y}" x2="${w}" y2="${y+30}" stroke="#4FB3A9" stroke-width="0.5" opacity="0.06"/>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice">
    <rect width="${w}" height="${h}" fill="#0C1A19"/>
    ${lines}
    ${rings}
    ${stars}
    <g transform="translate(450 800) scale(5.2)" opacity="0.05">
      <circle cx="-15" cy="-5" r="22" fill="none" stroke="#C9704A" stroke-width="2"/>
      <circle cx="15" cy="-5" r="22" fill="none" stroke="#C9704A" stroke-width="2"/>
      <circle cx="0" cy="18" r="22" fill="none" stroke="#C9704A" stroke-width="2"/>
      <path d="M-40 40 L-15 15 L-5 33 L10 10 L40 40" fill="none" stroke="#C9704A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </svg>`;
}
function applySvgFallbackBackground(){
  const svg = buildBackgroundSVG();
  const uri = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  const bg = document.getElementById('map-bg');
  bg.innerHTML = ''; // clear any previous live-map <img> element
  bg.style.backgroundImage = `url("${uri}")`;
  bg.style.filter = 'none'; // SVG is already toned for the theme, no extra sepia needed
  requestAnimationFrame(()=>bg.classList.add('loaded'));
}
function testSvgFallbackBackground(){
  applySvgFallbackBackground();
  logDebugEntry({ context:'Background image', action:'manual test: SVG fallback forced', message:'This uses an inline data URI, no network fetch at all. If you still see nothing after this, it is a display/CSS issue, not a loading issue — if this IS visible but a live map load reports "loaded" and still shows nothing, the issue is specific to external images.', attempts:null });
  closeModal();
}

const MAP_QUERIES = ['antique nautical chart parchment','old world map engraving','antique map torn edges','historical sea chart parchment','antique world map illustration','vintage cartography parchment','old map coastline engraving','antique atlas page'];
async function attemptMapFetch(query){
  const url = 'https://commons.wikimedia.org/w/api.php?action=query&generator=search'
    + '&gsrsearch=' + encodeURIComponent(query) + '&gsrnamespace=6&gsrlimit=12'
    + '&prop=imageinfo&iiprop=url%7Cmime&iiurlwidth=1600&format=json&origin=*';
  // Note: deliberately not using AbortController/signal here — Claude.ai's artifact
  // preview proxies fetch() through an internal message channel that can't structured-clone
  // an AbortSignal, which throws "The object can not be cloned." Timeout via Promise.race
  // instead, which works in both the preview sandbox and real deployment.
  const res = await Promise.race([
    fetch(url),
    new Promise((_, reject) => setTimeout(()=>reject(new Error('map fetch timed out')), 5000))
  ]);
  const data = await res.json();
  const pages = data.query && data.query.pages ? Object.values(data.query.pages) : [];
  const candidates = pages.map(p=>p.imageinfo && p.imageinfo[0]).filter(i=>i && i.mime && i.mime.indexOf('image/')===0 && i.mime.indexOf('svg')===-1);
  if(!candidates.length) throw new Error('no usable results');
  const pick = candidates[Math.floor(Math.random()*candidates.length)];
  const imgUrl = pick.thumburl || pick.url;
  // Load as a real <img> element (not CSS background-image) — reuse the same element that
  // proves the load succeeded, rather than discarding it and re-requesting via a different
  // browser code path that handles cross-origin resources differently. Deliberately NOT
  // setting crossOrigin here — we only display this image, never read its pixels via canvas,
  // so CORS isn't actually required, and requiring it anyway can make the browser block
  // display entirely if the server doesn't consistently send CORS headers for every request.
  const imgEl = await new Promise((resolve, reject) => {
    const el = new Image();
    el.onload = () => resolve(el);
    el.onerror = reject;
    el.src = imgUrl;
  });
  return { imgEl, imgUrl };
}
async function loadMapBackground(queryOverride){
  const attemptedQueries = [];
  const maxAttempts = queryOverride ? 1 : 3; // a scene-change query is specific, not worth retrying with something unrelated
  let lastErr = null;
  for(let i=0; i<maxAttempts; i++){
    // Pick a query not already tried this round, so retries genuinely explore different results
    // instead of hitting the same "no usable results" search again.
    const remaining = queryOverride ? [queryOverride] : MAP_QUERIES.filter(q=>!attemptedQueries.includes(q));
    const query = remaining[Math.floor(Math.random()*remaining.length)] || MAP_QUERIES[0];
    attemptedQueries.push(query);
    try{
      const { imgEl, imgUrl } = await attemptMapFetch(query);
      const bg = document.getElementById('map-bg');
      if(queryOverride){
        // Scene change — fade the old image out before swapping, so it reads as a deliberate
        // transition into a new area rather than an abrupt cut.
        bg.classList.remove('loaded');
        await new Promise(r=>setTimeout(r, 700));
      }
      bg.style.backgroundImage = ''; // clear any leftover SVG fallback
      bg.innerHTML = '';
      bg.appendChild(imgEl);
      requestAnimationFrame(()=>bg.classList.add('loaded'));
      logDebugEntry({ context:'Background image', action: queryOverride ? 'scene change → new map loaded' : 'live map loaded', message:`query "${query}" (attempt ${i+1}/${maxAttempts}) → ${imgUrl} (decoded ${imgEl.naturalWidth}x${imgEl.naturalHeight}px)`, attempts:null });
      try{ render(); }catch(e){}
      return;
    }catch(err){
      lastErr = err;
      console.warn(`Map fetch attempt ${i+1}/${maxAttempts} failed for "${query}":`, err.message);
    }
  }
  logDebugEntry({ context:'Background image', action:'fell back to SVG watermark', message:`tried ${attemptedQueries.length} quer${attemptedQueries.length>1?'ies':'y'} (${attemptedQueries.map(q=>`"${q}"`).join(', ')}), last error: ${lastErr ? lastErr.message : 'unknown'}`, attempts:null });
  if(!queryOverride) applySvgFallbackBackground(); // for a scene change, just keep the current background rather than reverting to the generic watermark
  try{ render(); }catch(e){}
}
loadMapBackground();
