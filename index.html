<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veyrune</title>
<style>
  :root{
    --bg:#0F1E1D; --panel:#16302D; --panel-alt:#1E3E3A; --line:#2E4B47;
    --cream:#E8DCC4; --cream-dim:#A8B3A6; --brass:#C9704A; --brass-dim:#8A4E34;
    --teal:#4FB3A9; --violet:#8B6BB8; --danger:#B8503F;
    --mono:'Courier New', ui-monospace, monospace; --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; margin:0; }
  body{
    color:var(--cream); font-family:var(--serif);
    overflow:hidden;
  }
  #map-canvas{ position:fixed; inset:0; z-index:-3;
    background-color:var(--bg);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(79,179,169,0.09), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(139,107,184,0.07), transparent 40%),
      radial-gradient(circle at 75% 95%, rgba(201,112,74,0.08), transparent 45%),
      repeating-linear-gradient(115deg, rgba(232,220,196,0.015) 0px, rgba(232,220,196,0.015) 2px, transparent 2px, transparent 5px),
      linear-gradient(160deg, #0F1E1D 0%, #0C1A19 55%, #0F1F1C 100%);
  }
  #map-bg{ position:fixed; inset:0; z-index:-2; background-size:cover; background-position:center; overflow:hidden;
    opacity:0; transition:opacity 1.4s ease; filter:sepia(30%) saturate(70%) brightness(0.55) blur(1px); }
  #map-bg.loaded{ opacity:1; }
  #map-bg img{ width:100%; height:100%; object-fit:cover; display:block; }
  #map-wash{ position:fixed; inset:0; z-index:-1;
    background:linear-gradient(180deg, rgba(15,30,29,0.72) 0%, rgba(15,30,29,0.55) 40%, rgba(15,30,29,0.8) 100%); }
  .scanlines{ position:fixed; inset:0; pointer-events:none; z-index:40;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 3px);
    opacity:0.3; mix-blend-mode:overlay; }

  #app{ display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:640px; margin:0 auto; position:relative; }

  /* ---- bottom tab bar: underline nav, not icon chips ---- */
  .tab-bar{
    display:flex; flex-shrink:0; background:rgba(19,42,39,0.9); backdrop-filter:blur(12px) saturate(130%);
    border-top:1px solid var(--line);
  }
  .tab-bar button{
    flex:1; background:none; border:none; border-bottom:2px solid transparent; color:var(--cream-dim); cursor:pointer;
    padding:11px 2px 9px; font-family:var(--mono); font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
  }
  .tab-bar button.active{ color:var(--teal); border-bottom-color:var(--teal); }
  .tab-bar button:hover{ color:var(--cream); }

  .tab-panel{ flex:1; overflow-y:auto; padding:18px 16px 24px; }
  .tab-panel h2{
    font-family:var(--mono); font-size:12px; letter-spacing:3px; text-transform:uppercase;
    color:var(--brass); margin:0 0 16px; display:flex; align-items:center; gap:8px;
    border-bottom:1px solid var(--line); padding-bottom:10px;
  }
  .tab-panel .subhead{ font-family:var(--mono); font-size:10px; color:var(--cream-dim); margin:20px 0 8px; letter-spacing:2px; text-transform:uppercase; }
  .tab-icon-inline{ width:13px; height:13px; color:var(--brass); flex-shrink:0; }

  /* ---- status strip ---- */
  .status-strip{
    display:flex; flex-direction:column; gap:6px; padding:11px 16px;
    background:rgba(19,42,39,0.85); backdrop-filter:blur(10px) saturate(130%);
    border-bottom:1px solid var(--line); font-family:var(--mono); font-size:11px;
    cursor:pointer; flex-shrink:0;
  }
  .status-strip .top-row{ display:flex; align-items:center; gap:14px; }
  .status-strip .glyph{ width:20px; height:20px; color:var(--brass); flex-shrink:0; }
  .status-strip .stats{ display:flex; gap:14px; flex-wrap:nowrap; color:var(--cream-dim); letter-spacing:0.5px; overflow:hidden; align-items:center; }
  .status-strip .stats b{ color:var(--brass); font-weight:normal; }
  .status-strip .quest-row{ font-size:10px; color:var(--cream-dim); padding-left:32px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .quest-badge{ font-family:var(--mono); font-size:10px; letter-spacing:1.5px; color:var(--brass); background:rgba(201,112,74,0.12); border:1px solid var(--brass-dim); display:inline-block; padding:3px 8px; border-radius:2px; margin:8px 0 6px; }
  .hud-hp{ display:flex; align-items:baseline; gap:8px; }
  .hud-hp-num{ font-family:var(--mono); letter-spacing:0.3px; }
  .hud-hp-label{ font-family:var(--mono); font-size:10px; color:var(--teal); letter-spacing:1.2px; }
  .hud-divider{ width:1px; height:12px; background:var(--line); flex-shrink:0; opacity:0.8; }
  .hud-ac{ font-family:var(--mono); letter-spacing:0.3px; color:var(--brass); white-space:nowrap; }
  .hud-vitals-bar{ height:2px; background:var(--line); border-radius:1px; overflow:hidden; margin:12px 0; }
  .hud-vitals-bar-fill{ height:100%; transition:width .3s, background .3s; }
  .hud-row2{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:2px; font-size:12px; }
  .hud-resources{ display:flex; align-items:center; gap:16px; overflow:hidden; }
  .hud-objective{ display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; color:var(--brass); letter-spacing:0.8px; flex-shrink:0; }
  .hud-objective span:last-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:15ch; }
  .status-strip .quest-row b{ color:var(--brass); font-weight:normal; }

  /* ---- chat feed: console log, not messenger bubbles ---- */
  #feed{ flex:1; overflow-y:auto; padding:18px 16px 10px; display:flex; flex-direction:column; gap:4px; }
  .turn-divider{ display:flex; align-items:center; gap:8px; margin:14px 0 10px; opacity:0.4; }
  .turn-divider .glyph{ width:12px; height:12px; color:var(--brass); flex-shrink:0; }
  .turn-divider .line{ flex:1; height:1px; background:var(--line); }
  .msg-dm{ font-family:var(--serif); font-size:15px; line-height:1.75; color:var(--cream); }
  .msg-companion{ font-family:var(--mono); font-size:12px; padding-left:12px; border-left:2px solid var(--brass); margin-top:8px; color:var(--cream-dim); }
  .msg-companion b{ color:var(--brass); letter-spacing:0.5px; font-size:10px; }
  .speaker-tag{
    display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:1px;
    color:var(--brass); opacity:0.75; margin-right:8px; vertical-align:2px;
  }
  .msg-player{
    font-family:var(--mono); font-size:13px; color:var(--teal); margin-top:14px; padding-left:0;
  }
  .msg-player .speaker-tag{ color:var(--teal); }
  .msg-player-ooc{
    font-family:var(--mono); font-size:13px; color:var(--violet); margin-top:14px;
  }
  .msg-dm-ooc{
    font-family:var(--mono); font-size:13px; color:var(--cream); margin-top:8px;
    border-left:2px solid var(--violet); padding-left:10px; background:rgba(139,107,184,0.06);
  }
  .msg-roll{
    font-family:var(--mono); font-size:11px; color:var(--brass); letter-spacing:0.5px;
    border-left:2px solid var(--brass); padding-left:10px; margin-top:6px;
  }
  .msg-roll .speaker-tag{ margin-right:6px; }
  .provider-tag{ font-family:var(--mono); font-size:9px; color:var(--cream-dim); opacity:0.55; margin-right:8px; letter-spacing:0.5px; text-transform:uppercase; }
  .msg-longpress{ cursor:pointer; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .msg-note{ font-family:var(--mono); font-size:11px; color:var(--cream-dim); font-style:italic; margin-top:6px; }
  .msg-ooc{
    font-family:var(--mono); font-size:11px; color:var(--violet); background:rgba(139,107,184,0.08);
    border:1px dashed var(--violet); padding:10px 12px; margin-top:10px; line-height:1.8;
  }
  .msg-ooc .speaker-tag{ color:var(--violet); opacity:0.9; display:block; margin-bottom:4px; }
  .msg-invalid{
    font-family:var(--mono); font-size:12px; color:#e08d7e; background:rgba(184,80,63,0.1);
    border:1px dashed var(--danger); padding:10px 12px; margin-top:10px; line-height:1.7;
  }
  .msg-invalid .speaker-tag{ color:var(--danger); opacity:0.95; display:block; margin-bottom:4px; letter-spacing:1px; }
  .override-hold{ user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; transition:filter .6s linear; }
  .override-hold:active{ filter:brightness(0.7); }
  .msg-thinking{ font-family:var(--mono); font-size:11px; color:var(--teal); opacity:0.7; letter-spacing:1px; text-transform:uppercase; }
  .msg-thinking::after{ content:''; display:inline-block; width:6px; }

  .enemy-strip{ padding:9px 16px; background:rgba(30,62,58,0.75); border-top:1px solid var(--line);
    font-family:var(--mono); font-size:11px; flex-shrink:0; letter-spacing:0.5px; text-transform:uppercase; }
  .enemy-strip .hp-bar{ height:5px; background:var(--bg); border:1px solid var(--line); overflow:hidden; margin-top:5px; }
  .enemy-strip .hp-fill{ height:100%; background:var(--danger); transition:width .3s; }

  .options-row{ display:flex; flex-direction:column; gap:1px; padding:10px 16px 0; flex-shrink:0; border-top:1px solid var(--line); }
  .options-row button{
    background:none; border:none; border-bottom:1px dashed var(--line); color:var(--cream-dim);
    font-family:var(--mono); font-size:12px; padding:9px 2px; cursor:pointer; text-align:left; letter-spacing:0.3px;
  }
  .options-row button:hover{ color:var(--teal); }
  .options-row button:last-child{ border-bottom:none; }

  /* ---- composer: terminal prompt, not a messenger pill ---- */
  .composer{ display:flex; align-items:center; gap:10px; padding:12px 16px; flex-shrink:0;
    background:rgba(19,42,39,0.95); backdrop-filter:blur(10px) saturate(130%); border-top:1px solid var(--line); }
  .composer input[type=text]{
    flex:1; background:none; border:none; border-bottom:1px solid var(--line); color:var(--cream);
    padding:8px 2px; font-family:var(--mono); font-size:16px; border-radius:0;
  }
  .composer input[type=text]:focus{ outline:none; border-bottom-color:var(--teal); }
  .composer input[type=text]::placeholder{ color:var(--cream-dim); opacity:0.5; }
  .icon-btn{
    background:none; border:1px solid var(--line); color:var(--cream-dim); width:34px; height:34px;
    border-radius:2px; cursor:pointer; font-size:15px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ border-color:var(--teal); color:var(--teal); }
  .icon-btn.send{ background:var(--brass-dim); border-color:var(--brass); color:var(--cream); font-family:var(--mono); font-size:11px; letter-spacing:1.5px; width:auto; padding:0 14px; }
  .claim-item-btn{
    flex:1; background:var(--brass-dim); border:1px solid var(--brass); color:var(--cream);
    font-family:var(--mono); font-size:13px; letter-spacing:0.5px; padding:12px 10px;
    border-radius:2px; cursor:pointer; animation:claimPulse 1.6s ease-in-out infinite;
  }
  .claim-item-btn:hover{ background:var(--brass); }
  @keyframes claimPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(201,112,74,0.35); } 50%{ box-shadow:0 0 0 6px rgba(201,112,74,0); } }
  .msg-dm.streaming-text::after{ content:'▌'; opacity:0.6; animation:blink 0.9s steps(1) infinite; margin-left:1px; }
  @keyframes blink{ 50%{ opacity:0; } }
  .icon-btn.ooc-toggle{ width:auto; padding:0 10px; font-family:var(--mono); font-size:10px; letter-spacing:1px; }
  .icon-btn.ooc-toggle.active{ background:rgba(139,107,184,0.18); border-color:var(--violet); color:var(--violet); }
  .composer.ooc-active{ border-top-color:var(--violet); background:rgba(139,107,184,0.06); }
  .composer.ooc-active input[type=text]{ border-bottom-color:var(--violet); }
  .icon-btn.send:hover{ background:var(--brass); }

  /* ---- modal overlay ---- */
  .overlay{ position:fixed; inset:0; background:rgba(6,14,13,0.88); backdrop-filter:blur(4px);
    display:flex; align-items:flex-end; justify-content:center; z-index:60; }
  @media (min-width:640px){ .overlay{ align-items:center; } }
  .sheet{
    background:var(--panel); border:1px solid var(--line); border-radius:10px 10px 0 0;
    width:100%; max-width:520px; padding:20px; animation:slideup .2s ease;
  }
  @media (min-width:640px){ .sheet{ border-radius:10px; } }
  @keyframes slideup{ from{ transform:translateY(20px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .sheet h3{ font-family:var(--mono); font-size:13px; letter-spacing:1.5px; text-transform:uppercase; color:var(--brass); margin:0 0 14px; }
  .sheet .flavor{ font-family:var(--serif); font-style:italic; color:var(--cream-dim); font-size:13px; margin-bottom:14px; }
  .die-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .die-grid button{
    background:var(--bg); border:1px solid var(--line); color:var(--cream); font-family:var(--mono);
    padding:14px 0; border-radius:2px; cursor:pointer; font-size:14px;
  }
  .die-grid button.active{ border-color:var(--teal); color:var(--teal); }
  .roll-result{ text-align:center; font-family:var(--mono); font-size:28px; color:var(--brass); margin:10px 0; }
  .roll-detail{ text-align:center; font-family:var(--mono); font-size:12px; color:var(--cream-dim); }
  label{ font-family:var(--mono); font-size:11px; color:var(--cream-dim); text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:6px; }
  select, textarea{ background:var(--bg); border:1px solid var(--line); color:var(--cream); padding:8px 10px;
    font-family:var(--mono); font-size:16px; border-radius:2px; width:100%; }
  textarea{ font-family:var(--serif); font-size:16px; resize:vertical; }
  .field{ margin-bottom:14px; }
  .charge-btns{ display:flex; gap:6px; flex-wrap:wrap; }
  .charge-btns button{ font-family:var(--mono); font-size:11px; padding:7px 11px; background:var(--bg);
    border:1px solid var(--line); color:var(--cream-dim); cursor:pointer; border-radius:2px; }
  .charge-btns button.active{ border-color:var(--violet); color:var(--violet); }
  .sheet-actions{ display:flex; gap:8px; margin-top:16px; }
  .sheet-actions button{ flex:1; font-family:var(--mono); font-size:12px; letter-spacing:1px; text-transform:uppercase;
    padding:11px 0; border-radius:2px; cursor:pointer; }
  .btn-primary{ background:var(--brass-dim); border:1px solid var(--brass); color:var(--cream); }
  .btn-primary:hover{ background:var(--brass); }
  .btn-secondary{ background:transparent; border:1px solid var(--line); color:var(--cream-dim); }
  .btn-secondary:hover{ border-color:var(--cream-dim); color:var(--cream); }
  .menu-item{ display:block; width:100%; text-align:left; background:none; border:none; color:var(--cream);
    font-family:var(--mono); font-size:13px; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .menu-item:last-child{ border-bottom:none; }
  .menu-item:hover{ color:var(--teal); }
  .inv-list{ list-style:none; padding:0; margin:0; max-height:220px; overflow-y:auto; }
  .item-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:rgba(30,62,58,0.4); border:1px solid var(--line); border-left:3px solid #5A6E68;
    border-radius:2px; margin-bottom:6px; padding:9px 11px; cursor:pointer;
  }
  .item-row:hover{ background:rgba(30,62,58,0.7); }
  .item-row.led-teal{ border-left-color:var(--teal); }
  .item-row.led-brass{ border-left-color:var(--brass); }
  .item-row.led-danger{ border-left-color:var(--danger); }
  .item-row.led-dim{ border-left-color:#5A6E68; cursor:default; }
  .item-row-name{ font-family:var(--serif); font-size:13px; color:var(--cream); }
  .item-row-arrow{ color:var(--cream-dim); font-size:14px; flex-shrink:0; }
  .inv-list li{ font-family:var(--mono); font-size:13px; padding:6px 0; border-bottom:1px dashed var(--line); }

  .ref-card{
    background:rgba(30,62,58,0.55); border:1px solid rgba(46,75,71,0.8); border-radius:2px;
    padding:12px; margin-bottom:10px; backdrop-filter:blur(6px) saturate(120%);
  }
  .ref-card img{ width:100%; max-height:180px; object-fit:cover; border-radius:2px; margin-bottom:8px; border:1px solid var(--line); filter:sepia(15%) saturate(90%); }
  .ref-card .rc-name{ font-family:var(--mono); color:var(--teal); font-size:13px; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:3px; }
  .ref-card .rc-meta{ font-family:var(--mono); font-size:11px; color:var(--cream-dim); }
  .ref-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:flex-end; }
  .ref-row .field-mini{ flex:1; min-width:120px; }
  .ref-row select{ width:100%; }
  .pill-btn{
    background:var(--brass-dim); border:1px solid var(--brass); color:var(--cream);
    padding:9px 16px; font-family:var(--mono); font-size:12px; letter-spacing:1px; text-transform:uppercase;
    cursor:pointer; border-radius:2px; white-space:nowrap; letter-spacing:1px;
  }
  .pill-btn:hover{ background:var(--brass); }
  .inv-remove{ background:none; border:none; color:var(--danger); cursor:pointer; font-family:var(--mono); font-size:11px; }
  .status-field{ margin-bottom:16px; }
</style>
</head>
<body>
<div class="scanlines"></div>
<div id="map-canvas"></div>
<div id="map-bg"></div>
<div id="map-wash"></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="glyph" viewBox="0 0 100 100">
      <circle cx="35" cy="40" r="22" fill="none" stroke="currentColor" stroke-width="4"/>
      <circle cx="65" cy="40" r="22" fill="none" stroke="currentColor" stroke-width="4"/>
      <circle cx="50" cy="65" r="22" fill="none" stroke="currentColor" stroke-width="4"/>
      <path d="M10 85 L35 60 L45 78 L60 55 L90 85" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<div id="app"></div>

<script>
// ============================================================
// STATE
// ============================================================
function createDefaultState(){
  return {
    character: {
      name:'Raken', species:'Coralkin', klass:'Tech Mage Schemer',
      hp:'Healthy', hpCurrent:20, hpMax:20, magicCharge:'stone',
      quest:'The Hum Job',
      inventory:['Relic-scanning kit','Rusted key (in pedestal)','Dormant egg-object (unpaired)'],
      // Real equipment slots — one item each for head/body/feet/accessory1/accessory2 (equipping
      // something new auto-swaps the old one back to inventory, doesn't just add on top). Hands
      // are capacity-based: 2 total, a one-handed item costs 1, a two-handed item costs both.
      equipment: { head:null, body:null, feet:null, accessory1:'Relic fragment (reactive)', accessory2:null },
      hands: [{ name:'Modified focus-tool', handsUsed:1 }],
      extraHandCapacity: 0, // only raised by a specific in-story ability (an extra limb, etc) — never assumed
      itemInfo: {}, // itemName -> description, populated as items are found/added
      itemQty: {}, // itemName -> stack count. Absent/1 means a single item, not a stack.
      coins: 15, // in coils, the world's base currency unit — see world bible
      magicReserve: 3,
      magicReserveMax: 3, // spendable pool for significant spellwork, separate from the per-roll grounding modifier
      // Real D&D 5e ability scores (standard array 15/14/13/12/10/8), assigned to fit a
      // careful tech-tinkerer who isn't built for a fight. Modifier = floor((score-10)/2).
      stats: { str:8, dex:13, con:10, int:15, wis:14, cha:12 },
      hitDie: 8, // d8 — used for HP gained per level-up
      level: 1,
      xp: 0,
      pendingFeatureLevels: [], // internal — level-gated unlocks not yet announced this session
      attacks: [
        { name:'Focus Pulse', type:'ranged', stat:'int', damageDie:'d6', damageType:'force', resourceCost:{ magicReserve:1 }, desc:"A discharge of grounded magic through the focus-tool." },
        { name:'Improvised Strike', type:'melee', stat:'dex', damageDie:'d4', damageType:'bludgeoning', resourceCost:null, desc:"Grab whatever's at hand and swing — no resource cost, always available." },
      ],
      // Real D&D skills are binary (proficient or not) — proficiency adds the current proficiency
      // bonus to a roll, nothing more granular. Raken starts proficient in the two that best fit
      // an established tinkerer (Relic Read, Jury-Rig), same idea as a class/background grant.
      skills: [
        { name:'Relic Read', stat:'int', proficient:true, desc:'Sense and interpret old-tech signatures.' },
        { name:'Scheme', stat:'cha', proficient:false, desc:'Fast-talk, misdirect, find the angle.' },
        { name:'Ground & Channel', stat:'wis', proficient:false, desc:'Draw on stone/water surroundings to boost a roll.' },
        { name:'Jury-Rig', stat:'int', proficient:true, desc:'Patch or repurpose tech in a pinch.' },
      ],
      // Save proficiencies — INT/WIS matches a real Wizard's actual save proficiencies, fitting a tech-mage.
      saveProficiencies: { str:false, dex:false, con:false, int:true, wis:true, cha:false },
      armorBonus: 0, // future equipped-armor bonus to AC, beyond the base 10 + Dex modifier
      conditions: [], // active D&D conditions: Prone, Restrained, Frightened, etc — see CONDITIONS_DATA
      deathSaves: { successes:0, failures:0 },
      stable: false, // true once death saves are won — still at 0 HP, but no longer actively dying
      exhaustion: 0, // 0-6, real D&D exhaustion levels — tracked separately since it's leveled, not binary like other conditions

// Real D&D 5e SRD XP threshold table (index 0 = level 1's threshold, i.e. 0).
const XP_THRESHOLDS = [0,300,900,2700,6500,14000,23000,34000,48000,64000,85000,100000,120000,140000,165000,195000,225000,265000,305000,355000];
const ASI_LEVELS = [4,8,12,16,19]; // standard Ability Score Improvement levels for most classes
function levelForXp(xp){
  let lvl = 1;

}
function xpForLevel(level){ return XP_THRESHOLDS[Math.min(Math.max(level,1),20)-1]; }

// XP is tier x level, not an AI-picked number — the AI only chooses which tier fits, code
// does the arithmetic. Scales with level so the same category of accomplishment is worth
// more as the character gets stronger, roughly tracking how much steeper the real 5e curve gets.
// XP is a fraction of the real gap to the NEXT level, not a flat number — this keeps pacing
// consistent across the whole 1-20 curve (which itself grows steeply, not linearly) instead of
// being wildly generous early on. Unique Event defaults to the same fraction as Hard unless the
// DM deliberately specifies a multiplier for something genuinely exceptional.
const XP_TIER_FRACTIONS = { low:0.03, medium:0.07, hard:0.12, main_quest:0.20, unique_event:0.12 };
function calcXpForTier(tier, level, multiplier){
  const lvl = Math.max(1, Math.min(20, level));
  if(lvl >= 20) return 0; // max level — nowhere left to put XP
  const gapToNext = xpForLevel(lvl + 1) - xpForLevel(lvl);
  const fraction = XP_TIER_FRACTIONS[tier] || 0;
  const mult = (multiplier && multiplier > 0) ? Math.min(3, multiplier) : 1; // capped so an "exceptional" event can't blow the curve open
  return Math.max(1, Math.round(fraction * gapToNext * mult));
}
// Enemy tiers — base ranges at level 1, scaled up with player level so the same tier stays
// meaningfully threatening as the character grows. The AI only ever picks which tier fits;
// every actual number (HP, AC, attack bonus, damage die) is rolled here, not chosen by it.
const ENEMY_TIERS = {
  lower:  { hp:[4,8],   ac:[8,10],  atk:[0,1], dice:['d4'] },
  mid:    { hp:[8,15],  ac:[10,12], atk:[1,2], dice:['d4','d6'] },
  upper:  { hp:[15,30], ac:[12,14], atk:[2,4], dice:['d6','d8'] },
  elite:  { hp:[30,50], ac:[14,16], atk:[4,6], dice:['d8','d10'] },
  boss:   { hp:[50,100],ac:[16,18], atk:[6,8], dice:['d10','d12'] },
};
function rollInRange(min, max){ return min + Math.floor(Math.random() * (max - min + 1)); }
function rollEnemyStatsForTier(tier, playerLevel){
  const t = ENEMY_TIERS[tier] || ENEMY_TIERS.lower;

  const hpMult = 1 + (lvl - 1) * 0.3; // roughly matches how much tougher a fair fight should get per level
  const acBonus = Math.floor((lvl - 1) / 4); // mirrors real proficiency bonus growth pace
  const atkBonus = Math.floor((lvl - 1) / 3);
  const hp = Math.max(1, Math.round(rollInRange(t.hp[0], t.hp[1]) * hpMult));
  const ac = rollInRange(t.ac[0], t.ac[1]) + acBonus;
  const attackBonus = rollInRange(t.atk[0], t.atk[1]) + atkBonus;

  return { hp, ac, attackBonus, damageDie };
}
function applyHpDelta(delta){
  const c = state.character;
  const wasAbove0 = c.hpCurrent > 0;
  c.hpCurrent = Math.max(0, Math.min(c.hpMax, c.hpCurrent + delta));
  c.hp = hpLabel(c.hpCurrent, c.hpMax);
  if(c.hpCurrent > 0){
    // Any real healing above 0 clears a dying/stable state — real 5e rule.
    c.deathSaves = { successes:0, failures:0 };
    c.stable = false;
    state.pendingDeathSave = false;
    state.lastDeathSaveRoll = null;
  } else if(c.hpCurrent <= 0 && wasAbove0 && !c.stable){
    state.pendingDeathSave = true;
    state.lastDeathSaveRoll = null; // fresh sequence, don't show a leftover number from last time

// A small hand-defined table of level-gated unlocks for Raken specifically — there's no class
// system here to hand out real features like Extra Attack, so this is the practical equivalent:
// new or upgraded attacks/skills at specific levels, the actual source of most 5e power growth.
const FEATURE_TABLE = [
  { level:3, type:'new_attack', attack:{ name:'Overcharge Pulse', type:'ranged', stat:'int', damageDie:'d8', damageType:'force', resourceCost:{ magicReserve:2 }, desc:'A riskier, harder discharge — bigger hit, bigger drain.' } },

  { level:7, type:'new_skill', skill:{ name:'Overclock', stat:'con', proficient:true, desc:'Push yourself or your gear past safe limits for a burst of performance.' } },
  { level:10, type:'upgrade_attack', name:'Focus Pulse', newDie:'d8' },

function applyXpDelta(delta){
  const c = state.character;
  const oldLevel = c.level;
  c.xp = Math.max(0, c.xp + delta); // XP is a cumulative running total, same as real 5e — never subtracted per level
  const newLevel = levelForXp(c.xp);
  const levelUps = [];
  const featureNotes = [];
  for(let lvl = oldLevel+1; lvl <= newLevel; lvl++){
    const conMod = abilityMod(c.stats.con);
    const hpGain = Math.max(1, Math.ceil((c.hitDie+1)/2) + conMod); // average hit-die roll, rounded up — real 5e convention (d8 -> 5)
    c.hpMax += hpGain;

      state.pendingStatPoint += 2; // +2 to one score, or +1/+1 to two — same total either way
      state.pendingSkillChoice += 1; // homebrew addition since there's no class/background to grant fixed proficiencies
    }
    if(lvl % 2 === 0) c.magicReserveMax += 1;
    FEATURE_TABLE.filter(f=>f.level===lvl).forEach(f=>{
      if(f.type==='new_attack'){ c.attacks.push({...f.attack}); featureNotes.push(`Learned a new attack: ${f.attack.name}.`); }

  }

  if(levelUps.length){
    c.hpCurrent = c.hpMax; // level-up heals to full — a real, felt reward, not just a bigger number
    c.hp = hpLabel(c.hpCurrent, c.hpMax);
  }

async function storageGet(key){
  if(typeof window.storage !== 'undefined'){
    try{ const r = await window.storage.get(key); return r ? r.value : null; }
    catch(e){ return null; } // key doesn't exist yet — that's fine, not an error
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  if(typeof window.storage !== 'undefined'){
    try{ await window.storage.set(key, value); }catch(e){ console.warn('save failed:', key, e); }
    return;
  }
  try{ localStorage.setItem(key, value); }catch(e){ console.warn('save failed:', key, e); }
}
async function storageDelete(key){
  if(typeof window.storage !== 'undefined'){
    try{ await window.storage.delete(key); }catch(e){ /* already gone — fine */ }
    return;
  }
  try{ localStorage.removeItem(key); }catch(e){}
}

  let restoredItemClaim = null;
  let restoredRoll = null;
  let restoredQuestOverflow = null;
  let restoredPayment = null;
  let restoredStatPoint = 0;
  let restoredSpellCast = null;
  try{
    const savedChat = await storageGet('veyrune:chat_transcript');
    if(savedChat){
      const parsed = JSON.parse(savedChat);
      if(Array.isArray(parsed)){
        // Old format from before options/combat were bundled in — chat only.
        if(parsed.length) restoredChat = parsed;
      } else if(parsed && Array.isArray(parsed.chat) && parsed.chat.length){
        restoredChat = parsed.chat;
        restoredOptions = parsed.lastOptions || [];
        restoredCombat = parsed.combat || null;
        restoredItemClaim = parsed.pendingItemClaim || null;
        restoredRoll = parsed.pendingRoll || null;
        restoredQuestOverflow = parsed.pendingQuestOverflow || null;
        restoredPayment = parsed.pendingPayment || null;
        restoredStatPoint = parsed.pendingStatPoint || 0;
        restoredSpellCast = parsed.pendingSpellCast || null;
      }
    }
  }catch(e){ /* fine, fall through to normal boot */ }

  try{
    // Always load disk first as the baseline, then always overlay local storage on top,
    // if any exists — local reflects whatever happened during play since, and wins for
    // any field it has. Local storage is never written back to the actual ./saves files;
    // it only updates in the browser until you manually export and redeploy.
    const fromDisk = await loadSaveFilesFromDisk();
    const fromStorage = await loadSaveFilesFromStorage();
    hasSave = fromDisk || fromStorage;
    if(hasSave) await persistSaveFiles(); // keep local storage in sync with the merged result
    if(!restoredChat && hasSave){
      startNewSessionBoundary();
      if(fromDisk && fromStorage) resumeNote = '💾 Loaded ./saves baseline, then this device\'s local progress on top of it.';
      else if(fromStorage) resumeNote = '💾 Resumed from this device\'s saved progress.';
      else resumeNote = '💾 Loaded save files from ./saves — continuing where you left off.';
    }
  }catch(e){
    console.warn('Could not load saved files, starting fresh:', e);
  }
  state.filesLoaded = true;
  state.booting = false;

  if(restoredChat){
    // Strip any restore notes already baked into the saved transcript from previous
    // reloads — otherwise every refresh permanently adds one more, since the whole array
    // (notes included) gets persisted again right after restoring. Cap at exactly one.
    state.chat = restoredChat.filter(m => !(m.type==='note' && m.text==='💾 Restored previous conversation.'));
    if(restoredOptions) state.lastOptions = restoredOptions;
    if(restoredCombat) state.combat = restoredCombat;
    if(restoredItemClaim) state.pendingItemClaim = restoredItemClaim;
    if(restoredRoll) state.pendingRoll = restoredRoll; // composer shows a Roll button — doesn't auto-open the modal
    if(restoredQuestOverflow) state.pendingQuestOverflow = restoredQuestOverflow;
    if(restoredPayment) state.pendingPayment = restoredPayment;
    if(restoredStatPoint) state.pendingStatPoint = restoredStatPoint;
    if(restoredSpellCast) state.pendingSpellCast = restoredSpellCast;

    // If the very last thing in the transcript is the player's own message with nothing
    // after it, the DM never actually answered — most likely a refresh happened mid-call.
    // Resend it now so it doesn't just sit there forever unanswered.
    const lastMsg = state.chat[state.chat.length - 1];
    const needsResponse = lastMsg && (lastMsg.type === 'player' || lastMsg.type === 'player-ooc');

    state.chat.push({ type:'note', text:'💾 Restored previous conversation.' });
    render();
    if(needsResponse){
      await sendAction(lastMsg.text, { isOOC: lastMsg.type === 'player-ooc', skipPlayerBubble:true });
    }
    return;
  }

  if(hasSave){
    state.chat.push({ type:'note', text: resumeNote });
    render();
    // Real DM call instead of pasting static whereWeAre text — this gets you actual
    // narration AND real response_options, so you land on something to tap immediately
    // instead of a blank composer.
    await sendAction('(resuming session)', { isResume:true, skipPlayerBubble:true });
  } else {
    state.chat.push({ type:'note', text: 'No saved progress found. If you have existing save files, go to Status → Import Save Files to load them before continuing.' });

    render();
  }
}
function startNewSessionBoundary(){
  // A fresh app open is a new sitting at the table. The imported "Recent Events" describe
  // the PAST session and are already folded into whereWeAre/quest — carrying that list
  // forward forever would just accumulate stale history in the Status tab. Open threads,
  // quest, character, world bible, and party all still persist across sessions as normal.
  state.sessionMeta.sessionNumber = (state.sessionMeta.sessionNumber || 1) + 1;
  state.sessionMeta.recentEvents = [];
}
async function persistSaveFiles(){
  await Promise.all([
    storageSet('veyrune:character_sheet', JSON.stringify(state.character)),
    storageSet('veyrune:world_bible', JSON.stringify(state.worldBible)),
    storageSet('veyrune:party', JSON.stringify(state.party)),
    storageSet('veyrune:session_log', JSON.stringify(state.sessionMeta)),
    storageSet('veyrune:quests', JSON.stringify(state.quests)),
    storageSet('veyrune:stashes', JSON.stringify(state.stashes)),
    storageSet('veyrune:creatures', JSON.stringify(state.creatureLog)),
  ]);
}
async function persistSettings(){
  await storageSet('veyrune:settings', JSON.stringify(state.settings));
}
function magicLabel(){
  return {water:'Near Water', stone:'On Stone', wet:'Wet Earth', none:'Ungrounded'}[state.character.magicCharge];
}
function rollDie(sides){ return Math.floor(Math.random()*sides)+1; }

let chatPersistTimer = null;
function scheduleChatPersist(){
  // Debounced — render() fires very often during streaming (once per character), so this
  // coalesces rapid updates into a single storage write ~600ms after things settle down.
  if(chatPersistTimer) clearTimeout(chatPersistTimer);
  chatPersistTimer = setTimeout(()=>{
    storageSet('veyrune:chat_transcript', JSON.stringify({
      chat: state.chat.slice(-200),
      lastOptions: state.lastOptions,
      combat: state.combat,
      pendingItemClaim: state.pendingItemClaim,
      pendingRoll: state.pendingRoll,
      pendingQuestOverflow: state.pendingQuestOverflow,
      pendingPayment: state.pendingPayment,
      pendingStatPoint: state.pendingStatPoint,
      pendingSpellCast: state.pendingSpellCast
    }));
  }, 600);
}

function retryDMError(idx){
  const item = state.chat[idx];

  state.chat.splice(idx, 1);
  sendAction(item.originalAction, { ...item.originalMeta, skipPlayerBubble:true });
}
function longPressAttrs(idx){
  return `onpointerdown="startLongPress(${idx})" onpointerup="cancelLongPress()" onpointerleave="cancelLongPress()" onpointercancel="cancelLongPress()" oncontextmenu="event.preventDefault(); openMessageMenu(${idx}); return false;"`;
}
let longPressTimer = null;
function startLongPress(idx){

}
let overrideHoldTimer = null;
function startOverrideHold(idx){

  overrideHoldTimer = setTimeout(()=>{ confirmOverride(idx); }, 600);
}
function cancelOverrideHold(){
  if(overrideHoldTimer){ clearTimeout(overrideHoldTimer); overrideHoldTimer = null; }
}
function dismissInvalidAction(idx){
  state.chat.splice(idx, 1);
  render();
}
function confirmOverride(idx){
  const item = state.chat[idx];
  if(!item || item.type !== 'invalid-action') return;
  state.chat.splice(idx, 1);
  sendAction(item.originalAction, { overrideInvalid:true });
}
function isLastPlayerMessage(idx){
  // Edit is only offered for the most recent thing you actually sent — editing anything
  // further back would undo/redo a much larger chunk of the conversation than intended.
  const item = state.chat[idx];
  if(!item || (item.type!=='player' && item.type!=='player-ooc')) return false;
  for(let i=idx+1; i<state.chat.length; i++){
    if(state.chat[i].type==='player' || state.chat[i].type==='player-ooc') return false;
  }
  return true;
}
function isWithinLastPlayerMessages(idx, n){
  // Delete gets a slightly wider window than Edit (last N sent messages, not just the last
  // one) — still bounded so deleting can't reach arbitrarily far back into the conversation.
  const item = state.chat[idx];
  if(!item || (item.type!=='player' && item.type!=='player-ooc')) return false;
  let countAfter = 0;
  for(let i=idx+1; i<state.chat.length; i++){
    if(state.chat[i].type==='player' || state.chat[i].type==='player-ooc') countAfter++;
  }
  return countAfter < n;
}
function openMessageMenu(idx){
  const item = state.chat[idx];
  if(!item || (item.type!=='player' && item.type!=='player-ooc' && item.type!=='roll')) return;
  state.modal = { kind:'message-menu', idx, editing:false, editText:item.text };
  render();
}
function renderMessageMenuModal(m){
  const item = state.chat[m.idx];
  if(!item) return '';
  if(m.editing){
    return `<div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="sheet">
        <h3>Edit Message</h3>
        <textarea id="msg-edit-textarea" rows="3" style="width:100%;">${escHtml(m.editText)}</textarea>
        <div class="sheet-actions">
          <button class="btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="saveMessageEdit()">Save</button>
        </div>
      </div>
    </div>`;
  }
  const canEdit = isLastPlayerMessage(m.idx);
  const canDelete = item.type==='roll' || isWithinLastPlayerMessages(m.idx, 2);
  return `<div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="sheet">
      <h3>${item.type==='roll' ? 'Dice Roll' : 'Your Message'}</h3>
      <div class="flavor">"${escHtml(item.text)}"</div>
      ${!canEdit && item.type!=='roll' ? `<div class="flavor" style="font-size:12px; opacity:0.7;">Editing is only available for the most recent message you sent.${canDelete ? '' : ' Delete is only available for your last 2 sent messages.'}</div>` : ''}
      <div class="sheet-actions">
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        ${canEdit ? `<button class="btn-primary" onclick="startMessageEdit()">Edit</button>` : ''}
        ${canDelete ? `<button class="btn-primary" style="background:var(--danger); border-color:var(--danger);" onclick="deleteMessage()">Delete</button>` : ''}
      </div>
    </div>
  </div>`;
}
function startMessageEdit(){ state.modal.editing = true; render(); }
function saveMessageEdit(){
  const newText = document.getElementById('msg-edit-textarea').value;
  const idx = state.modal.idx;
  const item = state.chat[idx];
  if(!item){ state.modal = null; render(); return; }
  if(item.preTurnSnapshot && !isLastPlayerMessage(idx)){
    // Shouldn't be reachable through the UI (the Edit button is hidden for this case),
    // but refuse it here too rather than trusting the caller.
    state.modal = null; render(); return;
  }

  if(item.preTurnSnapshot){
    // Undo whatever this message caused — coins, HP, quests, inventory, everything —
    // by restoring the exact state from right before it was originally sent, then drop
    // the old message and everything that came after it (the old response is now stale),
    // and resend the corrected text as a fresh action.
    const snap = item.preTurnSnapshot;
    state.character = JSON.parse(JSON.stringify(snap.character));
    state.worldBible = JSON.parse(JSON.stringify(snap.worldBible));
    state.party = JSON.parse(JSON.stringify(snap.party));
    state.sessionMeta = JSON.parse(JSON.stringify(snap.sessionMeta));
    state.combat = JSON.parse(JSON.stringify(snap.combat));
    state.quests = JSON.parse(JSON.stringify(snap.quests));
    state.chat = state.chat.slice(0, idx);
    state.pendingItemClaim = null;
    state.pendingRoll = null;
    state.lastOptions = [];
    state.modal = null;
    persistSaveFiles();
    sendAction(newText, item.type === 'player-ooc' ? { isOOC:true } : {});
  } else {
    // No snapshot (OOC messages never mutate state, or a plain dice-roll display) —
    // just correct the text in place, nothing to undo.
    item.text = newText;
    state.modal = null;
    render();
  }
}
function deleteMessage(){
  const idx = state.modal.idx;
  const item = state.chat[idx];
  if(!item){ state.modal = null; render(); return; }

  if(item.type === 'roll'){
    // Just a displayed dice result, not a real action with side effects — simple removal.
    state.chat.splice(idx, 1);
    state.modal = null;
    render();
    return;
  }

  if(!isWithinLastPlayerMessages(idx, 2)){
    // Shouldn't be reachable through the UI (the button is hidden for this case),
    // but refuse it here too rather than trusting the caller.
    state.modal = null; render(); return;
  }

  if(item.preTurnSnapshot){
    // Undo whatever this message (and anything after it) caused, same restore used for
    // editing — coins, HP, quests, inventory, all rolled back to right before it was sent.
    const snap = item.preTurnSnapshot;
    state.character = JSON.parse(JSON.stringify(snap.character));
    state.worldBible = JSON.parse(JSON.stringify(snap.worldBible));
    state.party = JSON.parse(JSON.stringify(snap.party));
    state.sessionMeta = JSON.parse(JSON.stringify(snap.sessionMeta));
    state.combat = JSON.parse(JSON.stringify(snap.combat));
    state.quests = JSON.parse(JSON.stringify(snap.quests));
  }
  // Drop this message and everything after it — the DM's old response (and anything past
  // that) was answering something that no longer exists, so it can't be left dangling.
  state.chat = state.chat.slice(0, idx);
  state.pendingItemClaim = null;
  state.pendingRoll = null;
  state.pendingQuestOverflow = null;
  state.lastOptions = [];
  state.modal = null;
  persistSaveFiles();
  render();
}
function renderEnemyStrip(){
  const c = state.combat;
  const pct = c.creatureMaxHp>0 ? Math.max(0,(c.creatureHp/c.creatureMaxHp)*100) : 0;
  const effects = (c.statusEffects||[]).map(e=>`${escHtml(e.icon||'●')} ${escHtml(e.name)} (${e.turnsLeft})`).join(' · ');
  return `<div class="enemy-strip">
    ⚔️ ${escHtml(c.creatureName)} — ${c.creatureHp}/${c.creatureMaxHp} HP
    <div class="hp-bar"><div class="hp-fill" style="width:${pct}%"></div></div>
    ${effects ? `<div style="margin-top:4px; font-size:10px; opacity:0.85;">${effects}</div>` : ''}
  </div>`;
}

function renderResetConfirmModal(){

    <div class="sheet">
      <h3>Reset Campaign?</h3>
      <div class="flavor">This clears everything — character, world bible, party, session log, and the current chat — back to the starting state. This can't be undone. Files sitting in your ./saves folder aren't affected until you download and overwrite them again.</div>
      <div class="sheet-actions">

      </div>

function closeModal(){
  // Dismissing a DM-requested roll cancels the pending requirement too — same as before,
  // there's no reopen affordance for it, so an explicit dismissal should actually clear it
  // rather than leaving a ghost requirement that reappears next reload.
  if(state.modal && state.modal.kind==='dice' && state.modal.requirement){
    state.pendingRoll = null;
  }
  state.modal = null;
  render();
}

// ---- Dice modal ----
function openDiceModal(requirement){
  // requirement: { die, reason } when the DM asked for a specific roll; null for a manual/quick roll
  state.pendingRoll = requirement || null;
  state.modal = { kind:'dice', requirement, chosenDie: requirement ? requirement.die : 'd20', result:null };
  render();
}
const STAT_LABELS = { str:'Strength', dex:'Dexterity', con:'Constitution', int:'Intelligence', wis:'Wisdom', cha:'Charisma' };
function chooseSkillProficiency(name){
  if(!state.pendingSkillChoice) return;
  const skill = state.character.skills.find(s=>s.name===name);
  if(!skill || skill.proficient) return;
  skill.proficient = true;
  state.pendingSkillChoice -= 1;
  persistSaveFiles();
  if(state.pendingSkillChoice <= 0 && state.modal && state.modal.kind==='skill-choice') state.modal = null;
  render();
}
function rollModifierFor(requirement){
  if(requirement && requirement.stat && state.character.stats[requirement.stat] != null){
    const c = state.character;
    const base = abilityMod(c.stats[requirement.stat]);
    if(requirement.save){
      const proficient = !!c.saveProficiencies[requirement.stat];
      const mod = base + (proficient ? proficiencyBonusForLevel(c.level) : 0);
      return { mod, label: `${STAT_LABELS[requirement.stat]} Save${proficient ? ' (proficient)' : ''}` };
    }
    if(requirement.skill){
      const skill = c.skills.find(s=>s.name===requirement.skill);
      const proficient = skill && skill.proficient;

      ${!canAfford ? `<div class="flavor" style="color:var(--danger); margin-top:8px;">Not enough Magic Reserve — attempting this will fizzle instead of casting.</div>` : ''}
      <div class="sheet-actions">
        <button class="btn-secondary" onclick="resolveSpellCast(false)">Decline</button>
        <button class="btn-primary" onclick="resolveSpellCast(true)" style="${canAfford?'':'background:var(--danger); border-color:var(--danger);'}">${canAfford ? 'Cast' : 'Attempt Anyway (fizzles)'}</button>
      </div>
    </div>
  </div>`;
}
function resolveSpellCast(accept){
  const p = state.pendingSpellCast;
  if(!p) return;
  const c = state.character;
  state.pendingSpellCast = null;
  state.modal = null;
  const pendingAttack = state._pendingAttackAfterSpellCast;
  state._pendingAttackAfterSpellCast = null;
  if(accept && c.magicReserve >= p.cost){
    c.magicReserve -= p.cost;
    state.chat.push({ type:'note', text:`✨ -${p.cost} Magic Reserve (now ${c.magicReserve}/${c.magicReserveMax}) — ${p.reason}` });
    persistSaveFiles();
    render();
    if(pendingAttack){ executeAttack(pendingAttack); }
    // Otherwise, any requires_roll already staged for this turn surfaces next via the composer's normal priority chain — no DM round-trip needed for a successful cast.
  } else if(accept && c.magicReserve < p.cost){
    state.pendingRoll = null; // the attack/spell can't proceed without the charge to fuel it
    state.chat.push({ type:'note', text:`💨 Not enough Magic Reserve — ${p.reason} fizzles.` });
    persistSaveFiles();
    sendAction(`(attempted ${p.reason} but it fizzled — not enough Magic Reserve)`);
  } else {
    state.pendingRoll = null;
    state.chat.push({ type:'note', text:`Declined to spend Magic Reserve on ${p.reason}.` });
    persistSaveFiles();
    sendAction(`(declined to cast ${p.reason})`);
  }
}

function resolvePayment(approve){

function resolveRetrieve(take){
  const item = state.modal.item;
  const stashIdx = state.modal.stashIndex;
  if(take){
    const c = state.character;
    if(c.inventory.includes(item.name) || isEquipped(item.name)){
      // Merge back into the existing stack rather than creating a second, duplicate entry.
      c.itemQty[item.name] = (c.itemQty[item.name] || 1) + item.qty;
    } else {
      c.inventory.push(item.name);
      c.itemInfo[item.name] = { desc: item.desc||'', damage: item.damage||null, armor: (item.armor!=null?item.armor:null), statBonus: item.statBonus||null };
      if(item.qty > 1) c.itemQty[item.name] = item.qty;
    }
    if(stashIdx != null && state.stashes[stashIdx]) state.stashes.splice(stashIdx, 1);
    state.chat.push({ type:'note', text:`📦 Took back: ${item.name}${item.qty>1?` ×${item.qty}`:''}` });
  } else {
    state.chat.push({ type:'note', text:`Left ${item.name} where it was.` });
  }
  state.modal = null;
  state.pendingItemClaim = null;
  persistSaveFiles();
  render();
}

async function fetchBestiary(){
  const type = state.bestiary.type;
  state.bestiary.status = 'Scanning ' + type + ' records…';
  render();
  try{
    // v1's ?type= query param isn't reliable — filter client-side against a broad sample instead.
    let data = await open5e(`/v1/monsters/?limit=100`);
    let matches = (data.results || []).filter(m => (m.type||'').toLowerCase() === type.toLowerCase());
    if(!matches.length && data.next){
      const page2 = await open5e(`/v1/monsters/?limit=100&offset=100`);
      matches = (page2.results || []).filter(m => (m.type||'').toLowerCase() === type.toLowerCase());
    }
    state.bestiary.results = matches;
    state.bestiary.status = matches.length ? '' : 'No records found in this sample — try again, or try a more common type.';
  }catch(err){
    state.bestiary.status = 'Lookup failed: ' + err.message;
    logDebugEntry({ context:'Bestiary lookup', action: state.bestiary.type, message: err.message, attempts: null });
  }
  render();
}

async function fetchSpellsTab(){
  const level = state.spells.level;
  state.spells.status = 'Pulling spell records…';
  render();
  try{
    let data = await open5e(`/v1/spells/?level_int=${level}&limit=30`);
    let results = data.results || [];
    if(!results.length){
      const broad = await open5e(`/v1/spells/?limit=100`);
      results = (broad.results||[]).filter(sp=>sp.level_int===level);
    }
    // Open5e aggregates the same core spells from multiple source books (SRD 2014, SRD 2024,
    // third-party reprints) — dedupe by name so the same spell doesn't show up twice.
    const seen = new Set();
    results = results.filter(sp=>{
      const key = (sp.name||'').toLowerCase().trim();
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    state.spells.results = results;
    state.spells.status = results.length ? '' : 'No spells found for that level.';
  }catch(err){
    state.spells.status = 'Lookup failed: ' + err.message;
    logDebugEntry({ context:'Spell lookup', action: 'level '+state.spells.level, message: err.message, attempts: null });
  }
  render();
}

function normalizeItemMeta(raw){
  if(!raw) return { desc:'', damage:null, armor:null, statBonus:null };
  if(typeof raw === 'string') return { desc: raw, damage:null, armor:null, statBonus:null }; // legacy plain-string entries
  return { desc: raw.desc||'', damage: raw.damage||null, armor: (raw.armor!=null?raw.armor:null), statBonus: raw.statBonus||null };
}
function itemLedClass(name, desc){
  const text = (name + ' ' + (desc||'')).toLowerCase();
  if(/reactive|charged|synced|warm|active/.test(text)) return 'led-teal';
  if(/broken|depleted|drained|cracked|dead|damaged/.test(text)) return 'led-danger';
  if(/dormant|inert|locked|sealed/.test(text)) return 'led-dim';
  return 'led-brass';
}
