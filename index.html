// ---- Groq (OpenAI-compatible) — same schema/instructions as Claude, different wire format ----
// Reusing DM_TOOL_SCHEMA.input_schema directly (not a separate hand-written copy) means any
// future schema change automatically applies to both providers with no risk of drift.
function buildGroqToolSchema(){
  return {
    type: "function",
    function: {
      name: "dm_response",
      description: DM_TOOL_SCHEMA.description,
      parameters: DM_TOOL_SCHEMA.input_schema
    }
  };
}
function toOpenAIMessages(anthropicStyleMessages){
  // Anthropic messages use content:[{type:'text',text}]; OpenAI/Groq just want a plain string.
  return anthropicStyleMessages.map(m => ({
    role: m.role,
    content: m.content.map(c=>c.text).join('\n')
  }));
}
async function callGroqApi(systemText, openaiMessages, signal){
  const res = await fetch("/api/groq", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      model: "llama-3.3-70b-versatile",
      max_tokens: 800,
      messages: [ { role:"system", content: systemText }, ...openaiMessages ],
      tools: [ buildGroqToolSchema() ],
      tool_choice: { type:"function", function:{ name:"dm_response" } }
    }),
    signal
  });
  if(!res.ok){
    let bodyText=''; try{ bodyText=(await res.text()).slice(0,300); }catch(e){}
    throw new Error(`Groq HTTP ${res.status}: ${bodyText || res.statusText}`);
  }
  const data = await res.json();
  const msg = data.choices && data.choices[0] && data.choices[0].message;
  const call = msg && msg.tool_calls && msg.tool_calls[0];
  if(!call) throw new Error('No tool call returned from Groq');
  let input;
  try{ input = JSON.parse(call.function.arguments); }catch(e){ throw new Error('Groq returned malformed JSON'); }
  return { input, usage: data.usage || {} };
}
// Fire Claude and Groq at the same time — first one back with a genuinely valid structured
// response wins; the loser's result (if it arrives at all) is just ignored. If Groq isn't
// configured (no GROQ_API_KEY on the server) it fails near-instantly and Claude wins by default,
// so this degrades gracefully with zero setup required beyond adding the key.
// Claude gets a 500ms head start, alone. If it responds within that window, Groq is never
// called at all — this is the common case, and it means most turns only cost one API call,
// not two. Groq only joins in if Claude is still pending once the grace period expires, and
// from that point it's a genuine race: whichever finishes first wins, and the other gets
// cancelled via AbortController (stops wasted work either way; may also reduce Anthropic
// billing specifically, since Anthropic's endpoints are documented to support cancellation —
// Groq's aren't, so cancelling it saves nothing there, but costs nothing to try either).
const DM_RACE_GRACE_MS = 500;
async function raceDMProviders(claudeBody, groqSystemText, groqMessages){
  const claudeController = new AbortController();
  const groqController = new AbortController();

  const claudePromise = (async () => {
    const data = await callDMApi(claudeBody, claudeController.signal);
    const toolUse = (data.content||[]).find(b=>b.type==='tool_use' && b.name==='dm_response');
    if(!toolUse) throw new Error('No structured response returned (Claude).');
    return { input: toolUse.input, usage: data.usage||{}, provider:'claude' };
  })();
  // Prevent "unhandled rejection" noise if this loses the race later — we still read the
  // real result via the variable below when it matters.
  claudePromise.catch(()=>{});

  let groqPromise = null;
  function startGroq(){
    if(groqPromise) return groqPromise;
    groqPromise = callGroqApi(groqSystemText, groqMessages, groqController.signal).then(r => Object.assign(r, { provider:'groq' }));
    groqPromise.catch(()=>{});
    return groqPromise;
  }

  const graceExpired = new Promise(resolve => setTimeout(()=>resolve('grace-expired'), DM_RACE_GRACE_MS));
  const firstSignal = await Promise.race([
    claudePromise.then(r => ({ kind:'result', r })).catch(e => ({ kind:'error', e })),
    graceExpired.then(() => ({ kind:'grace-expired' }))
  ]);

  if(firstSignal.kind === 'result'){
    return firstSignal.r; // fast enough — Groq never touched, only one call made this turn
  }
  if(firstSignal.kind === 'error'){
    // Claude already failed within the grace window — no reason to keep waiting, go to Groq now.
    try{
      return await startGroq();
    }catch(groqErr){
      throw new Error('Both providers failed: ' + firstSignal.e.message + ' | ' + groqErr.message);
    }
  }

  // Grace period expired with Claude still pending — bring Groq in and race what's left.
  startGroq();
  return new Promise((resolve, reject) => {
    let pending = 2;
    const failures = [];
    [claudePromise, groqPromise].forEach(p => {
      p.then(result => {
        if(result.provider === 'claude') groqController.abort(); else claudeController.abort();
        resolve(result);
      }).catch(err => {
        pending--;
        failures.push(err.message);
        if(pending === 0) reject(new Error('Both providers failed: ' + failures.join(' | ')));
      });
    });
  });
}

function buildStateSnapshot(){
  const c = state.character;
  return {
    hp:c.hp, magic_grounding:c.magicCharge, quest:c.quest,
    combat: { active:state.combat.active, enemy_name:state.combat.creatureName||null, enemy_hp:state.combat.active?state.combat.creatureHp:null, enemy_max_hp:state.combat.active?state.combat.creatureMaxHp:null, enemy_ac:state.combat.active?state.combat.enemyAC:null, enemy_attack_bonus:state.combat.active?state.combat.enemyAttackBonus:null, enemy_damage_die:state.combat.active?state.combat.enemyDamageDie:null, enemy_damage_type:state.combat.active?state.combat.enemyDamageType:null }
  };
}
function chatToApiHistory(){
  // Collapse our chat log into a compact user/assistant turn history for context.
  // Capped to the last ~16 turns — long-term memory already lives in session_summary,
  // quest, and open threads (sent fresh every call), so replaying the whole session's
  // transcript isn't needed and just slows every response down as sessions get long.
  const turns = [];
  state.chat.forEach(m=>{
    if(m.type==='player' || m.type==='player-ooc') turns.push({ role:'user', content:[{type:'text', text:m.text}] });
    else if(m.type==='dm') turns.push({ role:'assistant', content:[{type:'text', text:m.text}] });
  });
  return turns.slice(-16);
  // Note: no cache_control breakpoint here. A message-level breakpoint would need the
  // entire prefix before it — including the dynamic system block (character sheet, world
  // bible, quest, etc.) — to match a previous call byte-for-byte. That block changes on
  // almost every turn, so the breakpoint would just pay a cache-write cost with no
  // realistic chance of ever being reused. The tool schema and static instructions still
  // cache independently, since their own prefixes don't depend on this dynamic content.
}

// ---- OOC handling: matches trigger words from the DM instructions, handled entirely
// client-side so it's instant, free, and never triggers narration or time passing. ----
const OOC_TRIGGERS = ['check status','check inventory','check quest','recap','status','inventory'];
function isOOCMessage(text){
  const t = text.trim().toLowerCase();
  return OOC_TRIGGERS.some(trigger => t === trigger || t.startsWith(trigger + ' ') || t.includes('check my ' + trigger.replace('check ','')));
}
function handleOOC(){
  const c = state.character;
  state.chat.push({ type:'ooc', hp:c.hp, grounding:magicLabel(), quest:c.quest, inventory:[...c.inventory] });
  render();
}

function toggleOOCMode(){ state.oocMode = !state.oocMode; render(); }
function submitFreeform(){
  if(state.booting || state.loading) return; // a request is already in flight — refuse a second one
  const el = document.getElementById('composer-input');
  if(!el || !el.value.trim()) return;
  const text = el.value.trim();
  el.value = '';
  if(state.oocMode){ sendAction(text, { isOOC:true }); return; }
  if(isOOCMessage(text)){ handleOOC(); return; }
  sendAction(text);
}
function logDebugEntry(entry){
  state.debugLog.unshift({ time: new Date().toLocaleTimeString(), ...entry });
  if(state.debugLog.length > 50) state.debugLog.length = 50;
}
async function attemptBothEndpoints(body, signal){
  // /api/dm is the Vercel serverless proxy (keeps your API key server-side).
  // If it's not present — e.g. previewing this file inside Claude.ai's artifact panel —
  // fall back to calling Anthropic directly, which that environment authenticates for you.
  // Every attempt is logged with real status/body detail so failures are debuggable,
  // instead of collapsing into a generic "Load failed" message.
  const attempts = [];
  try{
    const res = await fetch("/api/dm", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(body),
      signal
    });
    if(res.status === 404){
      attempts.push({ endpoint:'/api/dm', status:404, detail:'no proxy route present (expected when previewing outside Vercel)' });
      throw new Error('no proxy route');
    }
    if(!res.ok){
      let bodyText = ''; try{ bodyText = (await res.text()).slice(0,400); }catch(e){}
      attempts.push({ endpoint:'/api/dm', status:res.status, detail:bodyText || res.statusText });
      const err = new Error(`/api/dm returned HTTP ${res.status}`);
      err.debugAttempts = attempts;
      throw err;
    }
    attempts.push({ endpoint:'/api/dm', status:res.status, detail:'ok' });
    return await res.json();
  }catch(e1){
    if(e1.name === 'AbortError') throw e1;
    if(!attempts.length) attempts.push({ endpoint:'/api/dm', status:null, detail: e1.message || 'network error (fetch threw before a response)' });
    try{
      const res2 = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(body),
        signal
      });
      if(!res2.ok){
        let bodyText2 = ''; try{ bodyText2 = (await res2.text()).slice(0,400); }catch(e){}
        attempts.push({ endpoint:'api.anthropic.com (direct)', status:res2.status, detail:bodyText2 || res2.statusText });
        const err = new Error(`Direct Anthropic call returned HTTP ${res2.status}`);
        err.debugAttempts = attempts;
        throw err;
      }
      attempts.push({ endpoint:'api.anthropic.com (direct)', status:res2.status, detail:'ok' });
      return await res2.json();
    }catch(e2){
      if(e2.name === 'AbortError') throw e2;
      if(!attempts.some(a=>a.endpoint.includes('anthropic.com'))){
        attempts.push({ endpoint:'api.anthropic.com (direct)', status:null, detail: e2.message || 'network error (fetch threw before a response)' });
      }
      const finalErr = new Error('Both DM endpoints failed — see debug log for details.');
      finalErr.debugAttempts = attempts;
      throw finalErr;
    }
  }
}
// ---- Incremental narration extraction while the tool-use JSON streams in ----
// The model streams its structured output as raw JSON text (input_json_delta chunks).
// We can't parse the whole thing until it's complete, but "narration" is the first
// schema field, so we can pull its string value out character-by-character as it
// arrives and show it live, well before the rest of the response finishes.
function createNarrationExtractor(onUpdate){
  let json = '';
  let phase = 'seek-key'; // seek-key -> seek-colon -> seek-quote -> in-string -> done
  let scanPos = 0;
  let value = '';
  let escaping = false;
  return function feed(chunk){
    json += chunk;
    if(phase === 'done') return;
    if(phase === 'seek-key'){
      const idx = json.indexOf('"narration"');
      if(idx === -1) return;
      scanPos = idx + '"narration"'.length;
      phase = 'seek-colon';
    }
    while(scanPos < json.length && phase !== 'done'){
      const ch = json[scanPos];
      if(phase === 'seek-colon'){
        if(ch === ':'){ phase = 'seek-quote'; }
        scanPos++;
        continue;
      }
      if(phase === 'seek-quote'){
        if(ch === ' ' || ch === '\n' || ch === '\t'){ scanPos++; continue; }
        if(ch === '"'){ phase = 'in-string'; scanPos++; continue; }
        phase = 'done'; return; // unexpected — bail out of live extraction quietly
      }
      if(phase === 'in-string'){
        if(escaping){
          if(ch === 'n') value += '\n';
          else if(ch === 't') value += '\t';
          else if(ch === '"') value += '"';
          else if(ch === '\\') value += '\\';
          else value += ch;
          escaping = false; scanPos++; continue;
        }
        if(ch === '\\'){ escaping = true; scanPos++; continue; }
        if(ch === '"'){ phase = 'done'; scanPos++; onUpdate(value); return; }
        value += ch; scanPos++; continue;
      }
    }
    if(phase === 'in-string') onUpdate(value);
  };
}
async function callDMApiStreaming(body, onNarrationDelta){
  const res = await fetch("/api/dm", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(Object.assign({}, body, { stream:true }))
  });
  if(res.status === 404 || !res.ok || !res.body) throw new Error('streaming proxy unavailable');

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  const extractor = createNarrationExtractor(onNarrationDelta);
  let buffer = '';
  let toolInputJson = '';
  let usage = {};

  while(true){
    const { done, value } = await reader.read();
    if(done) break;
    buffer += decoder.decode(value, { stream:true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for(const line of lines){
      const trimmed = line.trim();
      if(!trimmed.startsWith('data:')) continue;
      const dataStr = trimmed.slice(5).trim();
      if(!dataStr || dataStr === '[DONE]') continue;
      let evt;
      try{ evt = JSON.parse(dataStr); }catch(e){ continue; }
      if(evt.type === 'content_block_delta' && evt.delta && evt.delta.type === 'input_json_delta'){
        toolInputJson += evt.delta.partial_json;
        extractor(evt.delta.partial_json);
      } else if(evt.type === 'message_start' && evt.message && evt.message.usage){
        usage = Object.assign({}, usage, evt.message.usage);
      } else if(evt.type === 'message_delta' && evt.usage){
        usage = Object.assign({}, usage, evt.usage);
      } else if(evt.type === 'error'){
        throw new Error(evt.error && evt.error.message ? evt.error.message : 'stream error event');
      }
    }
  }
  if(!toolInputJson) throw new Error('no tool input received via stream');
  return { input: JSON.parse(toolInputJson), usage };
}
async function callDMApi(body, signal){
  try{
    return await attemptBothEndpoints(body, signal);
  }catch(err){
    if(err.name === 'AbortError') throw err; // intentional cancellation, not a connection drop — don't retry
    // Only auto-retry when BOTH attempts got no HTTP response at all (status: null on both) —
    // that's the signature of a dropped connection, worth one quick retry rather than an
    // HTTP error (401/429/etc), which won't fix itself by retrying.
    const bothNoResponse = (err.debugAttempts||[]).length >= 2 && err.debugAttempts.every(a => a.status === null);
    if(!bothNoResponse) throw err;
    await new Promise(r => setTimeout(r, 1200));
    try{
      return await attemptBothEndpoints(body, signal);
    }catch(err2){
      if(err2.name === 'AbortError') throw err2;
      err2.debugAttempts = [...(err.debugAttempts||[]), { endpoint:'(retry)', status:null, detail:'retried once after connection drop, still failed' }, ...(err2.debugAttempts||[])];
      throw err2;
    }
  }
}
async function sendAction(actionText, meta){
  if(state.loading) return; // a call is already in flight — refuse to start an overlapping one, from any trigger path
  meta = meta || {};
  if(!meta.skipPlayerBubble){
    // Snapshot everything mutable right before this action, so if the player edits this
    // message later (fixing a typo), we can cleanly undo whatever it caused — currency
    // spent, items gained, quests added, HP changes — before resending the corrected text.
    // Only real actions need this; OOC/resume never mutate state in the first place.
    const preTurnSnapshot = (!meta.isOOC && !meta.isResume) ? JSON.parse(JSON.stringify({
      character: state.character, worldBible: state.worldBible, party: state.party,
      sessionMeta: state.sessionMeta, combat: state.combat, quests: state.quests
    })) : null;
    state.chat.push({ type: meta.isOOC ? 'player-ooc' : 'player', text: actionText, preTurnSnapshot });
  }
  state.lastOptions = [];
  state.loading = true;
  render();

  const payload = {
    player_action: actionText,
    current_state: buildStateSnapshot(),
    resolution: meta.resolution || null,
    is_ooc: !!meta.isOOC,
    is_resume: !!meta.isResume,
    override_invalid: !!meta.overrideInvalid
  };
  const requestBody = {
    model: state.settings.fastMode ? "claude-haiku-4-5-20251001" : "claude-sonnet-4-6",
    max_tokens:800,
    system: [
      { type:"text", text: buildStaticInstructions(), cache_control:{ type:"ephemeral" } },
      { type:"text", text: buildDynamicContext() }
    ],
    tools:[DM_TOOL_SCHEMA],
    tool_choice:{ type:"tool", name:"dm_response" },
    messages:[...chatToApiHistory(), { role:'user', content:[{type:'text', text: JSON.stringify(payload)}] }]
  };
  // Groq gets the identical instructions + history, just reformatted for its wire format —
  // same source of truth as Claude, so tone shouldn't drift depending on who wins the race.
  const groqSystemText = buildStaticInstructions() + '\n\n' + buildDynamicContext();
  const groqMessages = toOpenAIMessages([...chatToApiHistory(), { role:'user', content:[{type:'text', text: JSON.stringify(payload)}] }]);

  try{
    const startedAt = performance.now();
    // Racing two providers can't be fairly combined with live streaming (there's no way to
    // know which one will actually finish first until it does) — this trades the live-typing
    // effect for genuinely picking whichever provider is fastest end-to-end this turn.
    const result = await raceDMProviders(requestBody, groqSystemText, groqMessages);
    const elapsedMs = Math.round(performance.now() - startedAt);
    const usage = result.usage || {};
    logDebugEntry({
      context: 'DM call timing',
      action: actionText,
      message: `${elapsedMs}ms (won: ${result.provider}${elapsedMs < DM_RACE_GRACE_MS ? ', groq skipped' : ', groq engaged'}) · in:${usage.input_tokens||usage.prompt_tokens||'?'} out:${usage.output_tokens||usage.completion_tokens||'?'} cache_read:${usage.cache_read_input_tokens||0}`,
      attempts: null
    });
    await applyDMResponse(result.input, meta, actionText, null, result.provider);
  }catch(err){
    logDebugEntry({
      context: 'DM API call',
      action: actionText,
      message: err.message,
      attempts: err.debugAttempts || null
    });
    state.chat.push({ type:'dm-error', text:`⚠️ DM connection failed — check Status → Debug Log for details.`, originalAction: actionText, originalMeta: meta });
  }
  state.loading = false;
  render();
  if(state._pendingHiddenRollFollowup){
    const followup = state._pendingHiddenRollFollowup;
    state._pendingHiddenRollFollowup = null;
    sendAction(followup.actionText, { resolution: followup.resolution, skipPlayerBubble:true });
  }
}
async function applyDMResponse(d, meta, originalActionText, existingMsgRef, provider){
  meta = meta || {};

  // Invalid-action check: the DM decided the described action isn't actually possible
  // (no such power, item doesn't exist/can't be removed, etc). Skip this entirely if the
  // player already chose to override — that retry is allowed to go through normally.
  if(!meta.isOOC && d.action_validity && d.action_validity.valid === false && !meta.overrideInvalid){
    if(existingMsgRef){
      const idx = state.chat.indexOf(existingMsgRef);
      if(idx>=0) state.chat.splice(idx,1);
    }
    state.chat.push({ type:'invalid-action', reason: d.action_validity.reason || "That doesn't seem possible right now.", originalAction: originalActionText });
    return;
  }

  if(existingMsgRef){
    existingMsgRef.text = d.narration;
    existingMsgRef.companions = meta.isOOC ? [] : (d.companions||[]);
    existingMsgRef.isOOC = !!meta.isOOC;
    existingMsgRef.streaming = false;
    existingMsgRef.provider = provider;
  } else {
    state.chat.push({ type:'dm', text:d.narration, companions: meta.isOOC ? [] : (d.companions||[]), isOOC: !!meta.isOOC, provider });
  }
  state.lastOptions = d.response_options || [];

  if(meta.isOOC){
    // OOC questions get answered but never touch character/quest/combat/world/party state,
    // and don't count as a save-worthy moment — nothing about the scene actually happened.
    return;
  }

  if(d.character_status && d.character_status.hp_delta) applyHpDelta(d.character_status.hp_delta);
  if(d.character_status && d.character_status.coins_delta){
    const delta = d.character_status.coins_delta;
    if(delta < 0){
      // Never deduct automatically — hold it for explicit approval, same pattern as items/rolls/quests.
      state.pendingPayment = { amount: Math.abs(delta), reason: d.character_status.spend_reason || 'a purchase' };
    } else {
      state.character.coins += delta;
      state.chat.push({ type:'note', text:`🪙 +${delta} coils (now ${state.character.coins})` });
    }
  }
  if(d.character_status && d.character_status.magic_reserve != null) state.character.magicReserve = Math.max(0, Math.min(state.character.magicReserveMax, d.character_status.magic_reserve));
  if(d.character_status && d.character_status.spend_magic_reserve){
    state.pendingSpellCast = { cost: d.character_status.spend_magic_reserve, reason: d.character_status.spend_magic_reason || 'a spell' };
  }
  if(d.character_status && d.character_status.xp_tier){
    const before = state.character.level;
    const xpAmount = calcXpForTier(d.character_status.xp_tier, state.character.level, d.character_status.xp_multiplier);
    if(xpAmount > 0){
      const result = applyXpDelta(xpAmount);
      const multNote = (d.character_status.xp_multiplier && d.character_status.xp_multiplier > 1) ? ` (x${d.character_status.xp_multiplier})` : '';
      state.chat.push({ type:'note', text:`✨ +${xpAmount} XP (${d.character_status.xp_tier.replace('_',' ')}${multNote}) — ${state.character.xp}/${xpForLevel(state.character.level+1)}` });
      if(result.levelUps.length){
        state.chat.push({ type:'note', text:`🎉 Level up! ${before} → ${state.character.level}. Max HP increased, full heal${state.pendingStatPoint?', stat points to allocate':''}${state.pendingSkillChoice?', new skill proficiency to choose':''}.` });
        result.featureNotes.forEach(f=>state.chat.push({ type:'note', text:`⭐ ${f}` }));
      }
    }
  }
  if(d.character_status){
    const c = state.character;
    (d.character_status.conditions_add||[]).forEach(cond=>{ if(!c.conditions.includes(cond)) c.conditions.push(cond); });
    (d.character_status.conditions_remove||[]).forEach(cond=>{ const i=c.conditions.indexOf(cond); if(i>=0) c.conditions.splice(i,1); });
    if(d.character_status.exhaustion_delta){
      c.exhaustion = Math.max(0, Math.min(6, c.exhaustion + d.character_status.exhaustion_delta));
      state.chat.push({ type:'note', text:`${d.character_status.exhaustion_delta>0?'😩':'😌'} Exhaustion ${d.character_status.exhaustion_delta>0?'+':''}${d.character_status.exhaustion_delta} (now level ${c.exhaustion})` });
    }
    if(d.character_status.rest === 'short'){
      const heal = Math.max(1, Math.ceil((c.hitDie+1)/2) + abilityMod(c.stats.con));
      applyHpDelta(heal);
      const reserveGain = Math.ceil(c.magicReserveMax/2);
      c.magicReserve = Math.min(c.magicReserveMax, c.magicReserve + reserveGain);
      state.chat.push({ type:'note', text:`💤 Short rest — +${heal} HP, +${reserveGain} Magic Reserve.` });
    } else if(d.character_status.rest === 'long'){
      c.hpCurrent = c.hpMax; c.hp = hpLabel(c.hpCurrent, c.hpMax);
      c.magicReserve = c.magicReserveMax;
      c.deathSaves = { successes:0, failures:0 }; c.stable = false; state.pendingDeathSave = false;
      if(c.exhaustion > 0) c.exhaustion -= 1;
      state.chat.push({ type:'note', text:`🌙 Long rest — full HP and Magic Reserve restored${c.exhaustion>0?`, exhaustion reduced to level ${c.exhaustion}`:''}.` });
    }
  }
  if(d.quest && d.quest.current) state.character.quest = d.quest.current;
  if(d.combat){
    if(d.combat.active){
      const wasActive = state.combat.active;
      const sameFight = wasActive && state.combat.creatureName === (d.combat.enemy_name || state.combat.creatureName);
      let ac, attackBonus, damageDie, damageType;
      if(sameFight){
        // Still fighting the same enemy — stats already set, never re-rolled mid-fight.
        ac = state.combat.enemyAC; attackBonus = state.combat.enemyAttackBonus;
        damageDie = state.combat.enemyDamageDie; damageType = state.combat.enemyDamageType;
      } else {
        const logged = state.creatureLog.find(cr => cr.name === d.combat.enemy_name);
        if(logged){
          // A creature type that's appeared before — reuse its exact stats for consistency.
          ac = logged.ac; attackBonus = logged.attackBonus; damageDie = logged.damageDie; damageType = d.combat.enemy_damage_type || logged.damageType;
        } else {
          // Genuinely new — roll fresh stats from the tier the AI picked. Real dice, not AI numbers.
          const rolled = rollEnemyStatsForTier(d.combat.enemy_tier || 'lower', state.character.level);
          ac = rolled.ac; attackBonus = rolled.attackBonus; damageDie = rolled.damageDie; damageType = d.combat.enemy_damage_type || 'physical';
          if(d.combat.enemy_hp == null) d.combat.enemy_hp = rolled.hp; // let the rolled HP stand if the AI didn't specify its own
          if(d.combat.enemy_max_hp == null) d.combat.enemy_max_hp = rolled.hp;
        }
      }
      state.combat = {
        active:true,
        creatureName:d.combat.enemy_name||'Unknown Foe',
        creatureHp:d.combat.enemy_hp??10,
        creatureMaxHp:d.combat.enemy_max_hp??10,
        statusEffects:d.combat.status_effects||[],
        enemyAC: ac, enemyAttackBonus: attackBonus, enemyDamageDie: damageDie, enemyDamageType: damageType,
      };
    } else if(state.combat.active){
      // Freeform DM-narrated defeat (not via the Attack button) — still gets real loot.
      applyLootOnDefeat(state.combat.creatureName, state.combat.creatureMaxHp);
      state.combat.active = false;
      state.combat.statusEffects = [];
    }
  }
  (d.save_worthy||[]).forEach(s=>state.sessionMeta.recentEvents.push(s));
  (d.quest && d.quest.new_threads || []).forEach(t=>state.sessionMeta.openThreads.push(t));
  if(d.session_summary){
    if(d.session_summary.where_we_are) state.sessionMeta.whereWeAre = d.session_summary.where_we_are;
    if(d.session_summary.new_area) loadMapBackground(d.session_summary.new_area);
  }

  let worldBibleChanged = false;
  if(d.world_bible_updates){
    const wb = state.worldBible;
    (d.world_bible_updates.new_locations||[]).forEach(l=>{ if(!wb.locations.includes(l)){ wb.locations.push(l); worldBibleChanged = true; } });
    (d.world_bible_updates.new_settlements||[]).forEach(s=>{
      if(!wb.settlements.some(existing=>existing.name===s.name)){ wb.settlements.push(s); worldBibleChanged = true; }
    });
    (d.world_bible_updates.new_factions||[]).forEach(f=>{ if(!wb.factions.includes(f)){ wb.factions.push(f); worldBibleChanged = true; } });
    (d.world_bible_updates.new_npcs||[]).forEach(n=>{ if(!wb.npcs.includes(n)){ wb.npcs.push(n); worldBibleChanged = true; } });
    (d.world_bible_updates.new_map_notes||[]).forEach(m=>{ if(!wb.map.includes(m)){ wb.map.push(m); worldBibleChanged = true; } });
    (d.world_bible_updates.new_artifacts||[]).forEach(a=>{ if(!wb.artifacts.includes(a)){ wb.artifacts.push(a); worldBibleChanged = true; } });
    if(d.world_bible_updates.currency && d.world_bible_updates.currency !== wb.currency){
      wb.currency = d.world_bible_updates.currency;
      worldBibleChanged = true;
    }
  }

  let questChanged = false;
  let questTag = null; // which category got new quest activity this turn, for the chat marker
  if(d.quest_updates){
    const qs = state.quests;
    (d.quest_updates.new_main||[]).forEach(x=>{
      if(!qs.main.some(e=>e.title===x.title)){
        qs.main.push(makeQuestEntry(qs, x));
        questChanged = true; questTag = 'main';
      }
    });
    (d.quest_updates.new_side||[]).forEach(x=>{
      if(addQuestOrOverflow(qs, 'side', x) === 'added'){ questChanged = true; questTag = questTag || 'side'; }
    });
    (d.quest_updates.new_small||[]).forEach(x=>{
      if(addQuestOrOverflow(qs, 'small', x) === 'added'){ questChanged = true; questTag = questTag || 'small'; }
    });
    (d.quest_updates.new_unique||[]).forEach(x=>{
      if(!qs.unique.some(e=>e.title===x.title)){
        qs.unique.push(makeQuestEntry(qs, x));
        questChanged = true; questTag = questTag || 'unique';
      }
    });
    (d.quest_updates.goal_done||[]).forEach(g=>{
      [qs.main, qs.side, qs.small, qs.unique].forEach(list=>{
        const quest = list.find(e=>e.title===g.title);
        if(quest){
          const goal = (quest.goals||[]).find(x=>x.text===g.goal);
          if(goal && !goal.done){ goal.done = true; questChanged = true; }
        }
      });
    });
    (d.quest_updates.complete||[]).forEach(title=>{
      [qs.main, qs.side, qs.small, qs.unique].forEach(list=>{
        const found = list.find(e=>e.title===title && e.status!=='complete');
        if(found){ found.status = 'complete'; questChanged = true; questTag = questTag || 'complete'; }
      });
    });
  }
  if(questTag){
    const lastDm = existingMsgRef || [...state.chat].reverse().find(m=>m.type==='dm' && !m.isOOC);
    if(lastDm) lastDm.questTag = questTag;
  }

  let partyChanged = false;
  if(d.party_updates){
    if(d.party_updates.bex_note && !state.party.bex.includes(d.party_updates.bex_note)){
      state.party.bex += `\n- ${d.party_updates.bex_note}`;
      partyChanged = true;
    }
    if(d.party_updates.thrum_note && !state.party.thrum.includes(d.party_updates.thrum_note)){
      state.party.thrum += `\n- ${d.party_updates.thrum_note}`;
      partyChanged = true;
    }
    if(d.party_updates.bex_status) state.party.bexStatus = d.party_updates.bex_status;
    if(d.party_updates.thrum_status) state.party.thrumStatus = d.party_updates.thrum_status;
  }

  let inventoryChanged = false;
  let newlyGained = [];
  if(d.inventory_updates){
    const c = state.character;
    if(!c.itemInfo) c.itemInfo = {};
    (d.inventory_updates.equip||[]).forEach(entry=>{
      const name = entry.name, slot = entry.slot;
      if(!c.inventory.includes(name)) return; // must actually be carried to equip it
      const result = equipItemToSlot(name, slot);
      if(result.ok){
        const idx = c.inventory.indexOf(name); if(idx>=0) c.inventory.splice(idx,1);
        inventoryChanged = true;
        if(result.displaced) state.chat.push({ type:'note', text:`🎒 ${result.displaced} unequipped to make room.` });
      } else {
        state.chat.push({ type:'note', text:`⚠️ Couldn't equip ${name} — ${result.reason}.` });
      }
    });
    (d.inventory_updates.unequip||[]).forEach(name=>{
      if(unequipItem(name)){
        if(!c.inventory.includes(name)) c.inventory.push(name);
        inventoryChanged = true;
      }
    });
    (d.inventory_updates.drop||[]).forEach(name=>{
      const ii = c.inventory.indexOf(name); if(ii>=0){ c.inventory.splice(ii,1); inventoryChanged = true; }
      if(unequipItem(name)) inventoryChanged = true;
      delete c.itemQty[name];
    });
    (d.inventory_updates.add||[]).forEach(entry=>{
      const name = entry.name, desc = entry.desc || '';
      const qty = entry.qty || 1;
      if(state.pendingLootRoll) state.pendingLootRoll = null; // fulfilled — this item counts as the owed loot narration
      if(c.inventory.includes(name) || isEquipped(name)){
        // Already carrying this one — grow the existing stack instead of silently doing nothing.
        c.itemQty[name] = (c.itemQty[name] || 1) + qty;
        inventoryChanged = true;
      } else {
        c.inventory.push(name);
        c.itemInfo[name] = { desc, damage: entry.damage||null, armor: (entry.armor!=null?entry.armor:null), statBonus: entry.stat_bonus||null };
        if(qty > 1) c.itemQty[name] = qty;
        newlyGained.push({ name, desc });
        inventoryChanged = true;
      }
    });
    (d.inventory_updates.update||[]).forEach(u=>{
      const invIdx = c.inventory.indexOf(u.old_name);
      let renamedEquipped = false;
      if(invIdx>=0){ c.inventory[invIdx] = u.new_name; inventoryChanged = true; }
      ['head','body','feet','accessory1','accessory2'].forEach(slot=>{
        if(c.equipment[slot]===u.old_name){ c.equipment[slot]=u.new_name; renamedEquipped=true; }
      });
      const hand = c.hands.find(h=>h.name===u.old_name);
      if(hand){ hand.name = u.new_name; renamedEquipped = true; }
      if(renamedEquipped) inventoryChanged = true;
      if(invIdx>=0 || renamedEquipped){
        const prevMeta = normalizeItemMeta(c.itemInfo[u.old_name]);
        delete c.itemInfo[u.old_name];
        c.itemInfo[u.new_name] = {
          desc: u.new_desc || '',
          damage: u.damage !== undefined ? u.damage : prevMeta.damage,
          armor: u.armor !== undefined ? u.armor : prevMeta.armor,
          statBonus: u.stat_bonus !== undefined ? u.stat_bonus : prevMeta.statBonus,
        };
        if(c.itemQty[u.old_name] != null){ c.itemQty[u.new_name] = c.itemQty[u.old_name]; delete c.itemQty[u.old_name]; }
      }
    });
    (d.inventory_updates.adjust_qty||[]).forEach(a=>{
      const current = c.itemQty[a.name] || (c.inventory.includes(a.name) ? 1 : 0);
      if(current <= 0) return; // don't have any of this to adjust
      const next = current + a.delta;
      if(next <= 0){
        delete c.itemQty[a.name];
        const idx = c.inventory.indexOf(a.name); if(idx>=0) c.inventory.splice(idx,1);
      } else {
        c.itemQty[a.name] = next;
      }
      inventoryChanged = true;
    });
    (d.inventory_updates.stash||[]).forEach(s=>{
      const currentQty = c.itemQty[s.name] || (c.inventory.includes(s.name) ? 1 : 0);
      const stashQty = (s.qty && s.qty < currentQty) ? s.qty : currentQty;
      if(stashQty <= 0) return; // don't have any to give
      const remaining = currentQty - stashQty;
      if(remaining > 0){
        c.itemQty[s.name] = remaining; // partial stash — rest stays in inventory
      } else {
        const ii = c.inventory.indexOf(s.name); if(ii>=0) c.inventory.splice(ii,1);
        delete c.itemQty[s.name];
        unequipItem(s.name);
      }
      const existingMeta = normalizeItemMeta(c.itemInfo[s.name]);
      const existingStash = state.stashes.find(e=>e.name===s.name && e.location===(s.location||'unspecified location'));
      if(existingStash){
        existingStash.qty = (existingStash.qty||1) + stashQty; // merge into an existing stash entry at the same location
      } else {
        state.stashes.push({ name:s.name, desc: s.desc || existingMeta.desc || '', location:s.location||'unspecified location', qty: stashQty, damage: existingMeta.damage, armor: existingMeta.armor, statBonus: existingMeta.statBonus });
      }
      inventoryChanged = true;
    });
    (d.inventory_updates.retrieve||[]).forEach(name=>{
      if(state.pendingItemClaim) return; // only one claim prompt at a time
      const idx = state.stashes.findIndex(s=>s.name===name);
      if(idx>=0){
        const stashed = state.stashes[idx]; // not removed yet — only once actually claimed
        state.pendingItemClaim = { kind:'retrieve', item: { name:stashed.name, desc:stashed.desc, damage:stashed.damage, armor:stashed.armor, statBonus:stashed.statBonus, qty: stashed.qty||1 }, stashIndex: idx };
      }
    });
  }

  (d.creature_log_add||[]).forEach(entry=>{
    const existingIdx = state.creatureLog.findIndex(cr=>cr.name===entry.name);
    const record = {
      name: entry.name, location: entry.location, tier: entry.tier,
      hp: entry.hp, ac: entry.ac, attackBonus: entry.attack_bonus,
      damageDie: entry.damage_die, damageType: entry.damage_type,
      description: entry.description, lootNotes: entry.loot_notes,
      onHitCondition: entry.on_hit_condition || null,
      lootTable: entry.loot_table || [],
      firstEncountered: existingIdx>=0 ? state.creatureLog[existingIdx].firstEncountered : state.sessionMeta.whereWeAre,
    };
    if(existingIdx>=0) state.creatureLog[existingIdx] = record;
    else state.creatureLog.push(record);
  });

  (d.knowledge_log_add||[]).forEach(entry=>{
    const existingIdx = state.knowledgeLog.findIndex(k => k.name===entry.name && k.category===entry.category);
    const now = state.sessionMeta.whereWeAre;
    if(existingIdx>=0){
      const existing = state.knowledgeLog[existingIdx];
      existing.knownInfo = entry.known_info; // the DM gives the fuller, current picture each time — not appended, replaced
      if(!existing.sources.includes(entry.source)) existing.sources.push(entry.source);
      existing.lastUpdated = now;
      state.chat.push({ type:'note', text:`📖 Knowledge updated: ${entry.name}` });
    } else {
      state.knowledgeLog.push({ name: entry.name, category: entry.category, knownInfo: entry.known_info, sources: [entry.source], firstLearned: now, lastUpdated: now });
      state.chat.push({ type:'note', text:`📖 New knowledge logged: ${entry.name}` });
    }
  });

  if(d.item_found){
    if(!state.character.itemInfo) state.character.itemInfo = {};
    state.character.itemInfo[d.item_found.name] = { desc: d.item_found.desc || '', damage: d.item_found.damage||null, armor: (d.item_found.armor!=null?d.item_found.armor:null), statBonus: d.item_found.stat_bonus||null };
    state.pendingItemClaim = { kind:'item', item:d.item_found };
  } else if(newlyGained.length){
    state.pendingItemClaim = { kind:'items-gained', items:newlyGained };
  } else if(d.requires_roll){
    state.pendingRoll = d.requires_roll;
  } else if(d.requires_hidden_roll){
    // An enemy/NPC roll — no player interaction needed, but still genuine client-side RNG,
    // not a number the DM just states. Shown transparently as a chat note either way.
    const req = d.requires_hidden_roll;
    const sides = parseInt(req.die.slice(1), 10);
    const roll = rollDie(sides);
    const bonus = req.bonus || 0;
    const total = roll + bonus;
    const hit = req.vs_ac != null ? (total >= req.vs_ac) : null;
    let label = `🎲 ${req.reason || 'Enemy roll'}: ${roll}${bonus?` ${bonus>=0?'+':''}${bonus} = ${total}`:''}`;
    if(hit != null) label += hit ? ' — hits!' : ' — misses!';
    state.chat.push({ type:'roll', text: label });
    let damageTotal = null;
    if(hit && req.then_damage){
      const dmgSides = parseInt(req.then_damage.die.slice(1), 10);
      const dmgRoll = rollDie(dmgSides);
      const dmgBonus = req.then_damage.bonus || 0;
      damageTotal = Math.max(0, dmgRoll + dmgBonus);
      applyHpDelta(-damageTotal);
      state.chat.push({ type:'roll', text:`🎲 Damage: ${dmgRoll} ${dmgBonus>=0?'+':''}${dmgBonus} = ${damageTotal} ${req.then_damage.type||''} (you: ${state.character.hpCurrent}/${state.character.hpMax} HP)` });
    }
    state._pendingHiddenRollFollowup = {
      actionText: `(hidden roll resolved: ${req.reason})`,
      resolution: { die:req.die, roll, modifier:bonus, total, reason:req.reason, vs_ac: req.vs_ac ?? null, hit, damage_dealt: damageTotal }
    };
  }

  await persistSaveFiles();
  if(worldBibleChanged || partyChanged || inventoryChanged || questChanged || (d.save_worthy||[]).length){
    const parts = [];
    if(worldBibleChanged) parts.push('world bible');
    if(partyChanged) parts.push('party');
    if(inventoryChanged) parts.push('inventory');
    if(questChanged) parts.push('quests');
    if((d.save_worthy||[]).length) parts.push('session log');
    state.chat.push({ type:'note', text:`💾 Auto-saved — ${parts.join(', ')} updated.` });
  }
}

function downloadMarkdown(filename, content){
  const blob = new Blob([content], {type:'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
const FILE_NAMES = { character_sheet:'character_sheet.md', world_bible:'world_bible.md', party:'party.md', session_log:'session_log.md', creatures:'creatures.md' };

// ---- Import: reverse of buildFileContent(), for loading real files back in ----
function splitTopLevelCommas(str){
  const parts = [];
  let depth = 0, current = '';
  for(const ch of str){
    if(ch === '(') depth++;
    if(ch === ')') depth--;
    if(ch === ',' && depth <= 0){ parts.push(current.trim()); current = ''; }
    else current += ch;
  }
  if(current.trim()) parts.push(current.trim());
  return parts;
}
function extractSection(text, header){
  // Global + take the LAST match: real session logs can have multiple concatenated
  // entries (session continued → session concluded) appended over time. Always want
  // the most recent block, which is further down the file, not the first one.
  const re = new RegExp(`##\\s*${header}.*\\n([\\s\\S]*?)(?=\\n##\\s|$)`, 'gi');
  const matches = [...text.matchAll(re)];
  return matches.length ? matches[matches.length - 1][1].trim() : '';
}
function extractListItems(sectionText){
  if(!sectionText) return [];
  return sectionText.split('\n')
    .map(l=>l.replace(/^-\s*/,'').trim())
    .filter(l=>l && !/^\(none yet\)$/i.test(l));
}
function extractField(text, label){
  const re = new RegExp(`\\*\\*${label}:?\\*\\*\\s*(.*)`, 'gi');
  const matches = [...text.matchAll(re)];
  return matches.length ? matches[matches.length - 1][1].trim() : null;
}
function applyCharacterSheetParse(parsed){
  const skillProficiencies = parsed.skillProficiencies;
  delete parsed.skillProficiencies;
  Object.assign(state.character, parsed);
  if(skillProficiencies){
    state.character.skills.forEach(s=>{ if(skillProficiencies[s.name] != null) s.proficient = skillProficiencies[s.name]; });
  }
}
function parseCharacterSheetMd(text){
  const name = extractField(text, 'Name');
  let species = extractField(text, 'Species/type') || extractField(text, 'Species');
  let klass = extractField(text, 'Class');
  // Your original character sheet writes this as one combined descriptive line
  // ("Coralkin — water/earth-fueled Tech Mage Schemer") rather than separate
  // Species/Class fields. Split on the em-dash so klass doesn't end up duplicated.
  if(species && species.includes('—')){
    const parts = species.split('—');
    const spOnly = parts[0].trim();
    const rest = parts.slice(1).join('—').trim();
    species = spOnly;
    if(!klass && rest) klass = rest;
  }
  const hp = extractField(text, 'HP') || extractField(text, 'HP / condition') || extractField(text, 'HP/condition');
  const grounding = extractField(text, 'Magic Grounding');
  const coinsLine = extractField(text, 'Coins');
  const reserveLine = extractField(text, 'Magic Reserve');
  const quest = extractField(text, 'Quest');
  const invLine = extractField(text, 'Inventory');
  const groundingMap = { 'Near Water':'water', 'On Stone':'stone', 'Wet Earth':'wet', 'Ungrounded':'none' };
  const out = {};
  if(name) out.name = name;
  if(species) out.species = species;
  if(klass) out.klass = klass;
  if(hp){
    const numMatch = hp.match(/(\d+)\s*\/\s*(\d+)/);
    if(numMatch){
      out.hpCurrent = parseInt(numMatch[1],10);
      out.hpMax = parseInt(numMatch[2],10);
      out.hp = hpLabel(out.hpCurrent, out.hpMax);
    } else if(['Healthy','Bruised','Hurt','Critical','Down'].includes(hp.trim())){
      // Old word-only format (no numbers) — keep the label as-is, don't touch the numeric pool.
      out.hp = hp.trim();
    }
  }
  if(grounding && groundingMap[grounding]) out.magicCharge = groundingMap[grounding];
  if(coinsLine){ const n = parseInt(coinsLine, 10); if(!isNaN(n)) out.coins = n; }
  if(reserveLine){ const m = reserveLine.match(/(\d+)\s*\/\s*(\d+)/); if(m){ out.magicReserve = parseInt(m[1],10); out.magicReserveMax = parseInt(m[2],10); } }
  if(quest) out.quest = quest.replace(/\s*\*\(.*?\)\*\s*$/, '').trim();
  if(invLine) out.inventory = splitTopLevelCommas(invLine).filter(Boolean);
  const headLine = extractField(text, 'Head');
  const bodyLine = extractField(text, 'Body');
  const feetLine = extractField(text, 'Feet');
  const acc1Line = extractField(text, 'Accessory 1');
  const acc2Line = extractField(text, 'Accessory 2');
  const handsLine = extractField(text, 'Hands \\(\\d+/\\d+\\)') || extractField(text, 'Hands');
  const cleanSlot = v => (v && !/^\(empty\)$/i.test(v)) ? v.trim() : null;
  if(headLine !== null || bodyLine !== null || feetLine !== null || acc1Line !== null || acc2Line !== null){
    out.equipment = { head:cleanSlot(headLine), body:cleanSlot(bodyLine), feet:cleanSlot(feetLine), accessory1:cleanSlot(acc1Line), accessory2:cleanSlot(acc2Line) };
  }
  if(handsLine && !/^\(both free\)$/i.test(handsLine)){
    out.hands = [...handsLine.matchAll(/([^,(]+)\((\d)h\)/g)].map(m=>({ name:m[1].trim(), handsUsed:parseInt(m[2],10) }));
  }
  const levelLine = extractField(text, 'Level');
  const xpLine = extractField(text, 'XP');
  if(levelLine){ const n = parseInt(levelLine,10); if(!isNaN(n)) out.level = n; }
  if(xpLine){ const m = xpLine.match(/^(\d+)/); if(m) out.xp = parseInt(m[1],10); } // cumulative total — only the first number matters now
  const str = extractField(text, 'STR');
  const dex = extractField(text, 'DEX');
  const con = extractField(text, 'CON');
  const int_ = extractField(text, 'INT');
  const wis = extractField(text, 'WIS');
  const cha = extractField(text, 'CHA');
  if(str || dex || con || int_ || wis || cha){
    const parseScore = v => v ? parseInt(v,10) : 10; // leading number before the "(+N)" modifier note
    out.stats = { str:parseScore(str), dex:parseScore(dex), con:parseScore(con), int:parseScore(int_), wis:parseScore(wis), cha:parseScore(cha) };
  }
  const hitDieLine = extractField(text, 'Hit Die');
  if(hitDieLine){ const m = hitDieLine.match(/d(\d+)/i); if(m) out.hitDie = parseInt(m[1],10); }
  const skillsSection = extractSection(text, 'Skills');
  if(skillsSection){
    const profs = {};
    extractListItems(skillsSection).forEach(line=>{
      const nameMatch = line.match(/\*\*(.+?)\*\*/);
      const profMatch = line.match(/\((Proficient|Untrained)\)/);
      if(nameMatch && profMatch) profs[nameMatch[1].trim()] = profMatch[1]==='Proficient';
    });
    if(Object.keys(profs).length) out.skillProficiencies = profs; // merged onto default skills by name via applyCharacterSheetParse
  }
  const itemDescSection = extractSection(text, 'Item Descriptions');
  if(itemDescSection && !/^\(none recorded yet\)$/i.test(itemDescSection.trim())){
    const itemInfo = {};
    let currentName = null;
    itemDescSection.split('\n').forEach(line=>{
      const topMatch = line.match(/^-\s*\*\*(.+?):\*\*\s*(.*)$/);
      if(topMatch){
        currentName = topMatch[1].trim();
        itemInfo[currentName] = { desc: topMatch[2].trim(), damage:null, armor:null, statBonus:null };
        return;
      }
      if(!currentName) return;
      const dmgMatch = line.match(/^\s+-\s*Damage:\s*(\S+)\s+(.+)$/i);
      if(dmgMatch){ itemInfo[currentName].damage = { die:dmgMatch[1].trim(), type:dmgMatch[2].trim() }; return; }
      const armorMatch = line.match(/^\s+-\s*Armor:\s*\+?(-?\d+)/i);
      if(armorMatch){ itemInfo[currentName].armor = parseInt(armorMatch[1],10); return; }
      const bonusMatch = line.match(/^\s+-\s*Bonus:\s*([+-]?\d+)\s+(\w+)/i);
      if(bonusMatch){ itemInfo[currentName].statBonus = { amount:parseInt(bonusMatch[1],10), stat:bonusMatch[2].trim().toLowerCase() }; return; }
    });
    if(Object.keys(itemInfo).length) out.itemInfo = itemInfo;
  }
  return out;
}
function parseWorldBibleMd(text){
  const currency = extractSection(text, 'Currency');
  const setting = extractSection(text, 'The Setting');
  const rulesSection = extractSection(text, 'Rules of This World');
  const settlementsRaw = extractListItems(extractSection(text, 'Settlements'));
  const settlements = settlementsRaw.map(line=>{
    const m = line.match(/^\*\*(.+?)\*\*\s*\((.+?)\)\s*—\s*(.*)$/);
    return m ? { name:m[1].trim(), type:m[2].trim(), notes:m[3].trim() } : { name:line, type:'other', notes:'' };
  }).filter(s=>s.name);
  const out = {
    locations: extractListItems(extractSection(text, 'Known Locations')),
    factions: extractListItems(extractSection(text, 'Factions')),
    npcs: extractListItems(extractSection(text, 'Key NPCs')),
    map: extractListItems(extractSection(text, 'Map Notes')),
    artifacts: extractListItems(extractSection(text, 'Notable Artifacts')),
    openThreads: extractListItems(extractSection(text, 'Ongoing Threads\\s*/\\s*Mysteries')), // routed to sessionMeta by the caller, not part of worldBible itself
  };
  if(settlements.length) out.settlements = settlements;
  if(currency && !/^\(not established/i.test(currency)) out.currency = currency;
  if(setting) out.setting = setting;
  if(rulesSection){
    // Top-level bullets are freeform rules; "### How X Works" subsections are structured
    // mechanics — flatten each into a single rule string so nothing gets silently dropped
    // on reload (this previously included Combat/Stats/Leveling/Attacks/Defenses/Death
    // Saves/Conditions/Resting/Equipment/Quests — all real content, none of it was parsed).
    const topLevelRules = rulesSection.split('\n### ')[0];
    const rules = extractListItems(topLevelRules);
    const subsectionMatches = [...rulesSection.matchAll(/###\s*(.+?)\n([\s\S]*?)(?=\n###\s|$)/g)];
    subsectionMatches.forEach(m=>{
      const heading = m[1].trim();
      const bullets = extractListItems(m[2]);
      bullets.forEach(b => rules.push(`[${heading}] ${b}`));
    });
    if(rules.length) out.rules = rules;
  }
  return out;
}
function parsePartyMd(text){
  const bex = extractSection(text, 'Bex');
  const thrum = extractSection(text, 'Thrum');
  const out = {};
  if(bex) out.bex = bex;
  if(thrum) out.thrum = thrum;
  return out;
}
function extractSubSection(text, header){
  const re = new RegExp(`###\\s*${header}.*\\n([\\s\\S]*?)(?=\\n###\\s|$)`, 'i');
  const m = text.match(re);
  return m ? m[1].trim() : '';
}
function parseQuestTierBlock(sectionText){
  if(!sectionText || /^-?\s*\(none yet\)$/i.test(sectionText.trim())) return [];
  const lines = sectionText.split('\n');
  const quests = [];
  let current = null;
  lines.forEach(line=>{
    const topMatch = line.match(/^-\s*\*\*(.+?)\*\*(\s*📌)?\s*—\s*(.*)$/);
    if(topMatch){
      if(current) quests.push(current);
      current = { title: topMatch[1].trim(), pinned: !!topMatch[2], desc: topMatch[3].trim(), goals: [], reward: '' };
      return;
    }
    const goalMatch = line.match(/^\s+-\s*\[([ xX])\]\s*(.+)$/);
    if(goalMatch && current){
      current.goals.push({ text: goalMatch[2].trim(), done: goalMatch[1].toLowerCase()==='x' });
      return;
    }
    const rewardMatch = line.match(/^\s+-\s*\*\*Reward:?\*\*\s*(.*)$/i);
    if(rewardMatch && current){
      current.reward = rewardMatch[1].trim();
      return;
    }
  });
  if(current) quests.push(current);
  return quests;
}
function parseActiveQuests(text){
  const questsSection = extractSection(text, 'Active Quests');
  if(!questsSection) return null;
  const completedTitles = extractListItems(extractSubSection(questsSection, 'Completed'));
  const build = (tierText, category) => parseQuestTierBlock(tierText).map(q => ({
    title: q.title, desc: q.desc,
    goals: q.goals.length ? q.goals : [],
    reward: q.reward || '??',
    status: completedTitles.some(t=>t.includes(q.title)) ? 'complete' : 'active',
    pinned: q.pinned, order: 0, category
  }));
  return {
    main: build(extractSubSection(questsSection, 'Main Quest'), 'main'),
    side: build(extractSubSection(questsSection, 'Side Quests[^\\n]*'), 'side'),
    small: build(extractSubSection(questsSection, 'Small Requests[^\\n]*'), 'small'),
    unique: build(extractSubSection(questsSection, 'Unique Events'), 'unique'),
  };
}
function parseStashedItems(text){
  const section = extractSection(text, 'Stashed Items');
  if(!section) return [];
  return extractListItems(section).map(line=>{
    const m = line.match(/\*\*(.+?)\*\*\s*—\s*left at:\s*(.*)/i);
    return m ? { name:m[1].trim(), desc:'', location:m[2].trim() } : null;
  }).filter(Boolean);
}
function parseCreaturesMd(text){
  const creatures = [];
  let currentLocation = null, current = null;
  text.split('\n').forEach(line=>{
    const locMatch = line.match(/^##\s+(.+)$/);
    if(locMatch && !line.startsWith('###')){ currentLocation = locMatch[1].trim(); return; }
    const nameMatch = line.match(/^###\s+(.+)$/);
    if(nameMatch){
      if(current) creatures.push(current);
      current = { name: nameMatch[1].trim(), location: currentLocation || 'Unknown', tier:'', hp:0, ac:0, attackBonus:0, damageDie:'d6', damageType:'physical', description:'', lootNotes:'', onHitCondition:null, lootTable:[], firstEncountered:'' };
      return;
    }
    if(!current) return;
    let m;
    if(m = line.match(/^-\s*\*\*Tier:\*\*\s*(.+)$/i)){ current.tier = m[1].trim(); return; }
    if(m = line.match(/^-\s*\*\*HP:\*\*\s*(\d+)/i)){ current.hp = parseInt(m[1],10); return; }
    if(m = line.match(/^-\s*\*\*AC:\*\*\s*(\d+)/i)){ current.ac = parseInt(m[1],10); return; }
    if(m = line.match(/^-\s*\*\*Attack Bonus:\*\*\s*\+?(-?\d+)/i)){ current.attackBonus = parseInt(m[1],10); return; }
    if(m = line.match(/^-\s*\*\*Damage:\*\*\s*(\S+)\s+(.+)$/i)){ current.damageDie = m[1].trim(); current.damageType = m[2].trim(); return; }
    if(m = line.match(/^-\s*\*\*Description:\*\*\s*(.+)$/i)){ current.description = m[1].trim(); return; }
    if(m = line.match(/^-\s*\*\*Loot Notes:\*\*\s*(.+)$/i)){ current.lootNotes = m[1].trim(); return; }
    if(m = line.match(/^-\s*\*\*On-Hit Condition:\*\*\s*(.+)$/i)){
      const val = m[1].trim();
      const cm = val.match(/^(.+?)\s*\((\d+)%/);
      current.onHitCondition = cm ? { condition: cm[1].trim(), chancePct: parseInt(cm[2],10) } : null;
      return;
    }
    if(m = line.match(/^\s+-\s*(.+?)\s*\(weight\s*(\d+)\)\s*—\s*(.+)$/i)){
      current.lootTable.push({ name: m[1].trim(), weight: parseInt(m[2],10), desc: m[3].trim() });
      return;
    }
    if(m = line.match(/^-\s*\*\*First Encountered:\*\*\s*(.+)$/i)){ current.firstEncountered = m[1].trim(); return; }
  });
  if(current) creatures.push(current);
  return creatures;
}
function parseSessionLogMd(text){
  const sessionMatches = [...text.matchAll(/\*\*Session:?\*\*\s*(\d+)/gi)];
  const sessionMatch = sessionMatches.length ? sessionMatches[sessionMatches.length-1] : null;
  const partyStatus = extractSection(text, 'Party Status');
  const bexStatus = partyStatus.match(/\*\*Bex:?\*\*\s*(.*)/i);
  const thrumStatus = partyStatus.match(/\*\*Thrum:?\*\*\s*(.*)/i);
  const out = {
    whereWeAre: extractSection(text, 'Where We Are Right Now'),
    currentHook: extractSection(text, 'Current Quest\\s*/\\s*Hook') || extractSection(text, 'Current Quest'),
    // "Recent Events" is the real template's name; "Save-Worthy Moments" is this app's older export name — try both
    recentEvents: extractListItems(extractSection(text, 'Recent Events')).length
      ? extractListItems(extractSection(text, 'Recent Events'))
      : extractListItems(extractSection(text, 'Save-Worthy Moments')),
    // openThreads is no longer parsed here — world_bible.md → Ongoing Threads / Mysteries is the single source of truth for this now.
  };
  if(sessionMatch) out.sessionNumber = parseInt(sessionMatch[1], 10);
  if(bexStatus) out.partyBexStatus = bexStatus[1].trim();
  if(thrumStatus) out.partyThrumStatus = thrumStatus[1].trim();
  const quests = parseActiveQuests(text);
  if(quests) out.quests = quests;
  const stashes = parseStashedItems(text);
  if(stashes.length) out.stashes = stashes;
  return out;
}
function detectFileKind(filename){
  const norm = filename.toLowerCase().replace(/\.md$/,'').replace(/[\s_-]+/g,'');
  if(norm.includes('charactersheet')) return 'character_sheet';
  if(norm.includes('worldbible')) return 'world_bible';
  if(norm === 'party' || norm.includes('party')) return 'party';
  if(norm.includes('sessionlog')) return 'session_log';
  if(norm.includes('creatures')) return 'creatures';
  return null;
}
async function handleImportFiles(event){
  const files = Array.from(event.target.files || []);
  if(!files.length) return;
  const loaded = [];
  for(const file of files){
    const kind = detectFileKind(file.name);
    if(!kind) continue;
    const text = await file.text();
    if(kind === 'character_sheet') applyCharacterSheetParse(parseCharacterSheetMd(text));
    else if(kind === 'world_bible'){ const parsedWb = parseWorldBibleMd(text); const wbThreads = parsedWb.openThreads; delete parsedWb.openThreads; Object.assign(state.worldBible, parsedWb); if(wbThreads && wbThreads.length) state.sessionMeta.openThreads = wbThreads; }
    else if(kind === 'party') Object.assign(state.party, parsePartyMd(text));
    else if(kind === 'session_log'){
      const parsed = parseSessionLogMd(text);
      if(parsed.partyBexStatus) state.party.bexStatus = parsed.partyBexStatus;
      if(parsed.partyThrumStatus) state.party.thrumStatus = parsed.partyThrumStatus;
      delete parsed.partyBexStatus; delete parsed.partyThrumStatus;
      const parsedQuests = parsed.quests; delete parsed.quests;
      const parsedStashes = parsed.stashes; delete parsed.stashes;
      Object.assign(state.sessionMeta, parsed);
      applyParsedQuests(parsedQuests);
      if(parsedStashes) state.stashes = parsedStashes;
    }
    else if(kind === 'creatures'){
      const parsedCreatures = parseCreaturesMd(text);
      if(parsedCreatures.length) state.creatureLog = parsedCreatures;
    }
    loaded.push(FILE_NAMES[kind]);
  }
  event.target.value = '';
  if(loaded.length){
    await persistSaveFiles();
    state.chat.push({ type:'note', text:`💾 Loaded from disk: ${loaded.join(', ')}. This is now the active save.` });
  }
  render();
}

  if(meta.statBonus) lines.push(`  - Bonus: ${meta.statBonus.amount>=0?'+':''}${meta.statBonus.amount} ${meta.statBonus.stat.toUpperCase()}`);

### How Combat Works
- Attack roll = d20 + grounding modifier, vs a target number the DM sets (typically 10-15).
- Hit damage = roll a d6.
- Grounding modifiers: Wet Earth +3, On Water/On Stone +2, Ungrounded -2.

### How Stats Work
- Six ability scores, real D&D 5e math: **Strength** (force/toughness), **Dexterity** (precision/reflexes), **Constitution** (endurance, and determines HP gained per level), **Intelligence** (tech/relics/puzzles), **Wisdom** (perception/instinct/composure), **Charisma** (social/presence/scheming).
- Modifier = floor((score-10)/2) — a score of 10-11 is +0, every 2 points above/below shifts the modifier by 1. Scores cap at 20.
- A non-magic roll can specify which ability applies; the app adds that ability's modifier *plus* the character's current proficiency bonus automatically. Magic/grounding rolls are unaffected and keep using the existing water/stone/wet mechanic.
- Raken's starting array (15/14/13/12/10/8 assigned by concept): INT 15, WIS 14, DEX 13, CHA 12, CON 10, STR 8 — a careful tinkerer who isn't built for a fight.

### How Leveling Works
- Real D&D 5e XP thresholds — cumulative total, never resets: 300 XP reaches level 2, 900 reaches level 3, 2700 for level 4, climbing steeply from there up to level 20.
- Proficiency bonus scales with level: +2 at levels 1-4, +3 at 5-8, +4 at 9-12, +5 at 13-16, +6 at 17-20.
- Each level grants max HP equal to the average roll of the character's hit die (rounded up) plus their Constitution modifier — Raken's hit die is d8, so roughly +5 HP per level before the Constitution adjustment — plus a full heal and a banked skill point. Every even level also grants +1 max Magic Reserve.
- Ability Score Improvements happen only at levels 4, 8, 12, 16, and 19 (the standard progression), granting 2 points total to freely allocate — both into one score, or split across two, same as the real rule's "+2 one score or +1/+1 two scores" choice.

### How Attacks & Skills Work
- **Attacks** are fixed reference moves — each has a type (melee/ranged/magic), an associated ability score, a damage die, a damage type, and sometimes a Magic Reserve cost. Damage on a hit = the die roll + that ability's modifier. A resource-costing attack spends its cost whether the attack hits or not.
- **Skills** are named capabilities (Relic Read, Scheme, Ground & Channel, Jury-Rig for Raken) that are binary — proficient or not, same as real D&D, no ranks or point-buy. Being proficient adds the character's current proficiency bonus to a roll using that skill; untrained adds nothing beyond the raw ability modifier.
- New skill proficiency choices are granted at levels 4, 8, 12, 16, and 19, alongside the Ability Score Improvement at those same levels — a homebrew adaptation, since there's no class/background here to hand out fixed proficiencies the normal way.
- **Status effects** (fire, poison, bleed, etc.) on an enemy are tracked for display only — the DM still narrates and applies the ongoing damage each turn manually, the tracker just keeps it visible so it isn't forgotten.
- **Items** carry the same kind of structured data when relevant — a weapon or tool-weapon can have a damage die/type, worn armor can have a flat AC bonus, and any item can carry an ability score bonus while equipped/carried. All three are optional per item and shown in the item's info panel alongside its description, not every item needs any of them.

### How Equipment Slots Work
- Real slots, not an unlimited list: Head, Body, Feet, and two Accessory slots each hold exactly one item — equipping something new to an occupied slot swaps the old item back to inventory automatically.
- Hands have a real 2-slot capacity: a one-handed item (most weapons, tools) costs 1, a two-handed item costs both. Can't equip beyond capacity — the app refuses it and explains why, rather than silently allowing it.
- Extra hand capacity beyond the normal 2 only comes from a specific in-story ability (an extra limb, a summoned appendage, etc) — never assumed by default.

### How Monsters & Loot Work
- Five tiers, scaled to the player's current level so fights stay fair as they grow stronger: **lower** (pest-level), **mid** (minor threat), **upper** (real fight), **elite** (dangerous), **boss**. The DM only ever picks which tier fits the story moment — every actual number (HP, AC, attack bonus, damage die) is rolled by the app within that tier's range, real dice, never an invented number.
- A creature's stats are set once when a fight starts and persist automatically. The player's Attack button resolves hit/miss and damage against those stored numbers in real code — and the enemy's counter-attack (if it survives) now happens automatically in the same sequence, not a separate turn waiting on the DM.
- **creatures.md** is a real reusable bestiary — the app automatically checks it before rolling new stats: a creature type that's appeared before reuses its exact logged stats, so a Fire Slime is always the same Fire Slime, no DM lookup required.
- **Conditions from combat** can be tied to a creature's own logged data (an on-hit chance, e.g. a venomous creature might always carry a real 30% chance to inflict Poisoned on a hit) — rolled automatically by the app every time that creature hits, not decided narratively in the moment.
- **Loot on defeat** is automatic, real dice: coins scale with the enemy's max HP. Item-loot is a separate chance roll — if the creature has an established loot table (a weighted list of possible items), the app picks a specific item from it automatically, no DM narration needed for repeat kills; only a genuinely new creature's first kill needs the DM to narrate an item and set up its table for next time.

### How XP Works
- The DM only ever picks a category — low, medium, hard, main quest, or unique event — never an exact number. The app computes the real amount as a fixed fraction of the actual gap to the next level, so pacing stays consistent across the whole 1-20 curve (which itself grows steeply, not linearly) rather than being front-loaded and overly generous early on. Roughly 8 hard-tier accomplishments per level, at any level.
- Unique Event defaults to the exact same amount as Hard — it isn't automatically a bigger reward. A genuinely exceptional unique event can get an optional multiplier (capped at 3x), used sparingly.
- Max level is 20; no further XP is awarded past that point.

### The Kernel & The Mpass — Why Only Raken Fights
- Centuries ago, Veyrune's civilization ran on a single vast intelligence — the shared substrate beneath everything later generations would call "magic" and "tech" separately, back when they weren't separate at all. Nobody worshipped it; it was just the system everything ran on, the way nobody worships electricity.
- It shattered. Nobody remembers why — conflict, catastrophe, something closer to a system failure at civilizational scale — but the fleet's scattering and the Kernel's shattering may be the same event, not two. Every piece of old-tech in Veyrune since, every relic, every reactive fragment, isn't an artifact *from* the Kernel — it's a fragment *of* it, still faintly running, still trying to reconnect with the rest of itself.
- An **Mpass** is one such fragment — a stamped metal token carved with the same glyph found on the key, the console, and Corr's disc (three interlocking rings split by a jagged line). Nobody in Veyrune knows what it actually is; to the world it's just a required key for anywhere real loot or danger lives — dungeons, Anchor sites, sealed hulls. Guild slang calls it the "Monster Pass," half-joking that it gets you in and gets you killed.
- **The downside, and the reason only one person per party ever fights:** any Kernel-touched creature can only clearly perceive — and be perceived by — someone carrying a fragment. To a carrier, the creature is fully solid and real. To everyone else, it's not quite there: flickering, out of phase, the way a corrupted signal never fully resolves. A non-carrier's attack doesn't get blocked or refused, it just doesn't land — there's nothing solid there to hit. The creature itself, once a fight starts, can only fixate on the one thing in the room that reads as real to it. It isn't a beacon and doesn't summon danger from a distance — it only matters once a fight has already begun.
- **Raken's fragment isn't carried, it's fused** — merged into their body as a child, during a warrior rite specific to their tribe, not practiced or understood anywhere else. It can't be removed, handed off, or set aside on a bad day, unlike every other Mpass in the world. Bex and Thrum aren't excluded by choice or law; a Kernel-touched threat simply cannot resolve them as real once a fight begins, and neither can they land a hit on it. Whether that reads as relief, guilt, or quiet resentment for either of them is worth surfacing over time.
- This reframes Raken's own stated reason for adventuring — hunting down and understanding old-world relics — as something far more personal than curiosity: Raken has carried one, fused into their own body, since before they could understand what it was. Whether the tribal rite was once performed with real knowledge of what these fragments are, since lost or forgotten, remains an open thread.
- Every reaction Raken's fragment has had — warming at the distress signal, syncing with the egg, pulsing near Corr's disc — is the same being, in pieces, recognizing another part of itself. Corr's grandmother's warning ("never let anyone dig deep into the old hull") may not be superstition, but someone who understood, at least partially, what's actually sleeping in these fragments.

### How Getting Stronger Actually Works
- Ability Score Improvements and rising Hit Points are real, but they're a slow trickle — most of a D&D character's power growth actually comes from unlocking new things to do, not bigger numbers on old things (a Fighter's Extra Attack, a Wizard's new spell levels, etc). There's no class system here, so Raken has a small hand-built table of level-gated unlocks instead: a new attack at level 3, an upgraded Improvised Strike at 5, a new skill at 7, an upgraded Focus Pulse at 10.
- Proficiency bonus climbing with level (+2 up to +6) is also a major, often-underrated source of growing power — it applies to every proficient skill, save, and attack at once.

### How Defenses Work
- **Armor Class (AC)** = 10 + Dexterity modifier (plus any armor bonus). This is the number an attacker's d20 roll needs to meet or beat to land a hit.
- **Passive Perception** = 10 + Wisdom modifier. The DM uses this to decide what the character notices without calling for an active roll.
- **Saving throws** are their own category, separate from skill checks — each of the 6 abilities has its own save, and the character can be proficient in specific ones (Raken: Intelligence and Wisdom, matching a real Wizard's save proficiencies). Proficiency bonus applies only if proficient in that specific save.
- **Advantage/Disadvantage**: certain rolls are made with advantage (roll 2d20, take the higher) or disadvantage (take the lower) instead of a flat single roll — reflects real situational edges or hindrances, not a permanent bonus.

### How Death Saves Work
- At 0 HP, the character isn't just "unconscious" — real death saves apply. Roll a d20: 10 or higher is a success, under 10 is a failure. A natural 20 revives outright at 1 HP. A natural 1 counts as two failures. Three successes stabilizes (still at 0 HP, no longer actively dying); three failures ends it — respecting the Hardcore Mode setting either way.
- Any real healing above 0 HP clears an ongoing death save count entirely.

### How Conditions Work
- Standard D&D conditions (Blinded, Charmed, Frightened, Grappled, Paralyzed, Poisoned, Prone, Restrained, Stunned, Unconscious, etc.) can be applied and removed by the DM as the story calls for them — see the Library tab's Conditions reference for what each one actually does mechanically.
- **Exhaustion** is tracked separately as a 0-6 level rather than a simple on/off condition, since its severity escalates (disadvantage on checks, halved speed, disadvantage on attacks/saves, halved max HP, and so on up to level 6, which is fatal).

### How Resting Works
- **Short Rest** recovers some HP (average hit-die roll + Constitution modifier) and about half of max Magic Reserve.
- **Long Rest** fully restores HP and Magic Reserve, clears any death save progress, and reduces Exhaustion by 1 level.

### How Quests Work
- **Main Quest** — the throughline; 1-2 active at a time, never more. Drives earning coin, story loot, encounters, NPCs, and exploring/traveling the map. Never capacity-limited, never evicted.
- **Side Quests** — max 5 active. Quick-to-medium arcs giving real backstory/texture (an NPC's life, a local trouble). Rewards: simple items, reasonable coin, occasionally something rare.
- **Small Requests** — max 10 active. Lightweight discrete facts/favors/leads (a favor asked in passing, a rumor, a code, a deadline) — exist so small details survive many turns without being forgotten.
- **Unique Events** — no cap, but rare by design. Simpler in scope than a Main Quest but genuinely harder to pull off. Big payoff: epic loot, meaningful coin, and something that eases the main story.
- **Every quest has real structure**: up to 3 concrete goals (checkable steps, ticked off as they're actually accomplished, not vague vibes) and a reward that's never left blank. Reward conventions: "??" means not yet decided/revealed; a "!!" prefix flags something notably advantageous (a rare tool, useful info, a real edge — not just a generic prize); otherwise it's a plain description, and can list multiple things at once (coin + an item) when warranted. Reward size/nature scales to the quest's tier *and* the personality/means of whoever's offering it. Once a Main Quest's 3 goals are all done, it completes and the next one in the throughline takes over.
- **Story-connected but not the throughline itself** — something that supports or ties into the main plot without being the singular ongoing quest — is a Side Quest, not an extra Main Quest slot.
- **Pinning** — up to 2 Side Quests and 2 Small Requests can be pinned to exempt them from eviction (Main/Unique never need pinning, they're never evicted).
- **When Side/Small hits its cap**, a new one doesn't silently bump an old one — you get an Accept/Reject prompt showing exactly which (oldest, unpinned) quest would be dropped. Accepting evicts it with a "you've forgotten about..." note; rejecting just declines the new one.
- Actual current quests (with their goals/reward) live in session_log.md → Active Quests, not here — this section is just the rules of how the system works.
`;
  }
  if(kind === 'party'){
